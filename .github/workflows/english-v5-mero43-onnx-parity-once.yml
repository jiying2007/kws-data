name: English V5 frozen Hey Mero 43K PyTorch to ONNX full-frame parity once
on:
  pull_request:
    paths:
      - automation/english_v5_mero43_onnx_parity_once.py
      - automation/test_english_v5_mero43_onnx_parity_once.py
      - .github/workflows/english-v5-mero43-onnx-parity-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-v5-mero43-onnx-parity-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v5-mero43-onnx-parity-${{ github.event_name }}
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '20261119'
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze canonical model SHA, ONNX numeric bounds, original model and source identity
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_v5_mero43_onnx_parity_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v5_mero43_onnx_parity_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  original-source-audit:
    needs: source-contract
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-prospective-dev8-original-44511329722
          run-id: 44511329722
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-original
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-prospective-dev8-saved-machine-screen-44514289065
          run-id: 44514289065
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-screen
      - name: Audit only previously compared 2+8 new development originals without any forward
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v5_mero43_onnx_parity_once.py --audit \
            --source "$RUNNER_TEMP/v5-original" --screen "$RUNNER_TEMP/v5-screen"
          test -z "$(git status --porcelain)"
  original-fsmn43-export-parity:
    needs: [source-contract, original-source-audit]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == '1c8b8c616ad912e5c615fae957e89f7d4b0234fd' &&
      needs.source-contract.result == 'success' &&
      needs.original-source-audit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exactly one first-main host model export parity execution
        shell: bash
        run: python3 -I -S -B automation/english_v5_mero43_onnx_parity_once.py --guard
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-prospective-dev8-original-44511329722
          run-id: 44511329722
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-original
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-prospective-dev8-saved-machine-screen-44514289065
          run-id: 44514289065
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-screen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-expanded-fsmn256-44495594627
          run-id: 44495594627
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-frozen43
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned CPU PyTorch NumPy ONNX Runtime without optimizer
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/v5-onnx-parity-env"
          PIP="$RUNNER_TEMP/v5-onnx-parity-env/bin/pip"
          "$PIP" install --disable-pip-version-check --no-cache-dir --retries 0 --timeout 90 \
            'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          "$PIP" install --disable-pip-version-check --no-cache-dir --retries 0 --timeout 90 \
            'numpy==1.26.4' 'onnxruntime==1.22.1'
          "$RUNNER_TEMP/v5-onnx-parity-env/bin/python" -m pip check
      - name: Actual exact PT versus ONNX frame logits and full CTC event parity on original 10 DEV WAVs
        shell: bash
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=25s 850s \
            "$RUNNER_TEMP/v5-onnx-parity-env/bin/python" -I -B \
              automation/english_v5_mero43_onnx_parity_once.py --execute \
              --source "$RUNNER_TEMP/v5-original" \
              --screen "$RUNNER_TEMP/v5-screen" \
              --weights "$RUNNER_TEMP/v5-frozen43" \
              --output "$RUNNER_TEMP/v5-mero43-onnx-parity-$GITHUB_RUN_ID"
          test -z "$(git status --porcelain)"
      - name: Preserve exact observed numeric parity or original STOP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v5-mero43-onnx-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/v5-mero43-onnx-parity-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
