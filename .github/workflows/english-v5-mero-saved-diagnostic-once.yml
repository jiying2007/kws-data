name: English V5 actual saved mono FSMN-CTC failure diagnosis once
on:
  pull_request:
    paths:
      - automation/english_v5_mero_saved_diagnostic_once.py
      - automation/test_english_v5_mero_saved_diagnostic_once.py
      - .github/workflows/english-v5-mero-saved-diagnostic-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-v5-mero-saved-diagnostic-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v5-actual-weight-diagnosis-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONHASHSEED: '20261119'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prove exact real 240-step frozen model pin and 0 optimizer calls
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_v5_mero_saved_diagnostic_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v5_mero_saved_diagnostic_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  original-model-audit:
    needs: source-contract
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download original 240-step model ZIP only, no inference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/jiying2007/kws-data/actions/artifacts/14496732088/zip \
            > "$RUNNER_TEMP/original-v5-fsmn-ctc.zip"
      - name: Authenticate archived 240 loss/weight receipts and the real 6/6 development failure
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v5_mero_saved_diagnostic_once.py \
            --audit-model --model-zip "$RUNNER_TEMP/original-v5-fsmn-ctc.zip"
          test -z "$(git status --porcelain)"
  one-saved-weight-dev-review:
    needs: [source-contract, original-model-audit]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == '0ea22c50024df7ab8797a4fb9517a01a261832db' &&
      needs.source-contract.result == 'success' &&
      needs.original-model-audit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Authenticate one and only one protected-main saved-weight review
        run: python3 -I -S -B automation/english_v5_mero_saved_diagnostic_once.py --guard
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download original immutable 240-step model and eight source/screen ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v5-diagnostic-originals"
          gh api repos/jiying2007/kws-data/actions/artifacts/14496732088/zip \
            > "$RUNNER_TEMP/v5-original-frozen-model.zip"
          for item in \
            'fresh24-source:14422271973' 'fresh24-screen:14429385634' \
            'fresh18-source:14429578824' 'fresh18-screen:14429884666' \
            'piper24-source:14434542792' 'piper24-screen:14436377961' \
            'newtrain24-source:14486048125' 'newtrain24-screen:14489594100'; do
            name="${item%%:*}"; id="${item#*:}"
            gh api "repos/jiying2007/kws-data/actions/artifacts/$id/zip" \
              > "$RUNNER_TEMP/v5-diagnostic-originals/$name.zip"
          done
      - name: Install CPU-only frozen model readback dependencies; never optimize
        shell: bash
        timeout-minutes: 16
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/v5-diagnostic-env"
          PIP="$RUNNER_TEMP/v5-diagnostic-env/bin/pip"
          FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90"
          "$PIP" install $FLAGS 'torch==2.9.1+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
          "$PIP" install $FLAGS 'numpy==1.26.4'
          "$RUNNER_TEMP/v5-diagnostic-env/bin/python" -m pip check
      - name: Read 17 original dev/train samples and saved CTC token/blank traces ONCE
        shell: bash
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=25s 650s \
            "$RUNNER_TEMP/v5-diagnostic-env/bin/python" -I -B \
              automation/english_v5_mero_saved_diagnostic_once.py --replay-dev \
              --model-zip "$RUNNER_TEMP/v5-original-frozen-model.zip" \
              --sources "$RUNNER_TEMP/v5-diagnostic-originals" \
              --output "$RUNNER_TEMP/v5-mero-diagnostic-$GITHUB_RUN_ID"
      - name: Preserve real loss trajectory and per-record token diagnostics or exact STOP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v5-mero-saved-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/v5-mero-diagnostic-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
