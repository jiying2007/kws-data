name: English V6 B10 hard-negative TRAIN source plus fresh six-speaker DEV once
on:
  pull_request:
    paths:
      - automation/english_v6_b10_hardneg_train_dev_source_plan.json
      - automation/english_v6_b10_hardneg_train_dev_source_once.py
      - automation/test_english_v6_b10_hardneg_train_dev_source_once.py
      - .github/workflows/english-v6-b10-hardneg-source-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-v6-b10-hardneg-source-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v6-b10-hardneg-source-${{ github.event_name }}
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '2'
  PYTHONHASHSEED: '20261121'
jobs:
  source-contract:
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze exact six prequalified TRAIN source identities and six new DEV speakers before audio
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_v6_b10_hardneg_train_dev_source_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v6_b10_hardneg_train_dev_source_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  exact-source-identity:
    needs: source-contract
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-fresh24-original-44478554596
          run-id: 44478554596
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b10-original-train-source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-fresh24-saved-machine-screen-44483128198
          run-id: 44483128198
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b10-original-train-screen
      - name: Fetch exact official Piper speaker map without running synthesis
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/b10-piper-map-env"
          "$RUNNER_TEMP/b10-piper-map-env/bin/pip" install --disable-pip-version-check --no-cache-dir --retries 0 'huggingface-hub==0.36.2'
          "$RUNNER_TEMP/b10-piper-map-env/bin/python" -I -c 'from huggingface_hub import hf_hub_download; import shutil,sys; shutil.copyfile(hf_hub_download(repo_id="rhasspy/piper-voices",revision="de3dcfdf1912bb49726dc4aa11c26017ce2ac62a",filename="en/en_US/libritts/high/en_US-libritts-high.onnx.json",token=False),sys.argv[1])' "$RUNNER_TEMP/b10-piper-config.json"
          python3 -I -S -B automation/english_v6_b10_hardneg_train_dev_source_once.py --preflight-config --model-config "$RUNNER_TEMP/b10-piper-config.json" --train-source "$RUNNER_TEMP/b10-original-train-source" --train-screen "$RUNNER_TEMP/b10-original-train-screen"
          test -z "$(git status --porcelain)"
  actual-source:
    needs: [source-contract, exact-source-identity]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == 'd61c6f23bdc8c99fd6306cb2e3311e8910196442' &&
      needs.source-contract.result == 'success' &&
      needs.exact-source-identity.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-fresh24-original-44478554596
          run-id: 44478554596
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b10-original-train-source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-fresh24-saved-machine-screen-44483128198
          run-id: 44483128198
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b10-original-train-screen
      - name: Verify exact first main successor and source provenance before TTS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v6_b10_hardneg_train_dev_source_once.py --guard
          python3 -I -S -B automation/english_v6_b10_hardneg_train_dev_source_once.py --source-check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned Piper CPU synthesis runtime
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/b10-piper-env"
          "$RUNNER_TEMP/b10-piper-env/bin/pip" install --disable-pip-version-check --no-cache-dir --retries 0 --timeout 90 'piper-tts==1.8.0' 'numpy==1.26.4' 'scipy==1.15.3' 'huggingface-hub==0.36.2'
          "$RUNNER_TEMP/b10-piper-env/bin/python" -m pip check
      - name: Generate exactly six TRAIN hard-negative candidates and twelve new DEV originals once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 28
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1500s "$RUNNER_TEMP/b10-piper-env/bin/python" -I -B automation/english_v6_b10_hardneg_train_dev_source_once.py --generate --output "$RUNNER_TEMP/b10-hardneg-source-${GITHUB_RUN_ID}" --train-source "$RUNNER_TEMP/b10-original-train-source" --train-screen "$RUNNER_TEMP/b10-original-train-screen"
          python3 -I -S -B automation/english_v6_b10_hardneg_train_dev_source_once.py --readback --output "$RUNNER_TEMP/b10-hardneg-source-${GITHUB_RUN_ID}" --train-source "$RUNNER_TEMP/b10-original-train-source" --train-screen "$RUNNER_TEMP/b10-original-train-screen"
          test -z "$(git status --porcelain)"
      - name: Archive original 18 WAVs, source identities, and explicit STOP receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v6-b10-hardneg-train-dev-source-${{ github.run_id }}
          path: ${{ runner.temp }}/b10-hardneg-source-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
