name: English Kokoro full context32 diagnostic once
on:
  pull_request:
    paths:
      - .github/workflows/english-kokoro-context32-once.yml
      - automation/english_kokoro_context32_source.py
      - automation/english_kokoro_context32_once.py
      - automation/english_kokoro_context32_observe.py
      - automation/english_kokoro_context32_compare.py
      - automation/english_kokoro_context32_plan.json
      - automation/test_english_kokoro_context32.py
      - automation/test_english_kokoro_context32_observe.py
      - automation/test_english_kokoro_context32_compare.py
      - docs/ENGLISH_KOKORO_CONTEXT32_DIAGNOSTIC_20261117.md
  push:
    branches: [main]
    paths:
      - automation/english_kokoro_context32_plan.json
permissions:
  contents: read
  actions: read
concurrency:
  group: english-kokoro-context32-20261117-${{ github.event_name }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_TELEMETRY: '1'
jobs:
  source-contract:
    if: github.repository == 'jiying2007/kws-data' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.contract.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify sources and mock receipts without models or audio derivation
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal optimized stripped; do
            args=()
            case "$mode" in optimized) args=(-O);; stripped) args=(-OO);; esac
            python3 -I -S -B "${args[@]}" automation/test_english_kokoro_context32.py -v
            python3 -I -S -B "${args[@]}" automation/test_english_kokoro_context32_observe.py -v
            python3 -I -S -B "${args[@]}" automation/test_english_kokoro_context32_compare.py -v
            python3 -I -S -B "${args[@]}" automation/english_kokoro_context32_once.py \
              --plan automation/english_kokoro_context32_plan.json --source-check
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
          python3 -I -S -B - <<'PYCODE'
          import json, os, pathlib
          plan = json.loads(pathlib.Path('automation/english_kokoro_context32_plan.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('enabled=' + str(plan['enabled']).lower() + '\n')
          PYCODE
  prepare:
    needs: source-contract
    if: >-
      needs.source-contract.outputs.enabled == 'true' && github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      source_ready: ${{ steps.readback.outputs.source_ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enforce the one actual main predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir "$RUNNER_TEMP/context32-prepare-runtime"
          python3 -I -S -B automation/english_kokoro_context32_once.py \
            --plan automation/english_kokoro_context32_plan.json --guard \
            > "$RUNNER_TEMP/context32-prepare-runtime/GUARD.json"
      - name: Fetch both exact original ZIPs and actual API identities
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PYCODE'
          import json, os, pathlib, subprocess
          plan = json.loads(pathlib.Path('automation/english_kokoro_context32_plan.json').read_bytes())
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'context32-original-inputs'
          folder.mkdir(mode=0o700)
          previous = plan['previous']
          for kind in ('source', 'probe'):
              pin = previous['artifacts'][kind]
              for suffix, endpoint in (('.artifact.json', 'repos/jiying2007/kws-data/actions/artifacts/' + str(pin['id'])),
                                       ('.zip', 'repos/jiying2007/kws-data/actions/artifacts/' + str(pin['id']) + '/zip')):
                  with (folder / (kind + suffix)).open('xb') as stream:
                      subprocess.run(['gh', 'api', endpoint], check=True, stdout=stream, timeout=120)
          with (folder / 'run.json').open('xb') as stream:
              subprocess.run(['gh', 'api', 'repos/jiying2007/kws-data/actions/runs/' + str(previous['run_id'])],
                  check=True, stdout=stream, timeout=60)
          PYCODE
      - name: Install only the fixed numerical resampling runtime
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/context32-prep-venv"
          "$RUNNER_TEMP/context32-prep-venv/bin/python" -m pip install \
            numpy==1.26.4 scipy==1.15.3 \
            > "$RUNNER_TEMP/context32-prepare-runtime/INSTALL.log" 2>&1
          "$RUNNER_TEMP/context32-prep-venv/bin/python" -m pip check \
            > "$RUNNER_TEMP/context32-prepare-runtime/PIP_CHECK.log" 2>&1
          "$RUNNER_TEMP/context32-prep-venv/bin/python" -m pip freeze --all \
            > "$RUNNER_TEMP/context32-prepare-runtime/PIP_FREEZE.txt"
      - name: Derive all sixteen complete new inputs without a speech model
        shell: bash
        timeout-minutes: 12
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 11m "$RUNNER_TEMP/context32-prep-venv/bin/python" -I -B \
            automation/english_kokoro_context32_once.py --plan automation/english_kokoro_context32_plan.json \
            --prepare --inputs "$RUNNER_TEMP/context32-original-inputs" --output "$RUNNER_TEMP/context32-source" \
            > "$RUNNER_TEMP/context32-prepare-runtime/COMMAND_STDOUT.json" \
            2> "$RUNNER_TEMP/context32-prepare-runtime/COMMAND_STDERR.log"
          code=$?
          CODE="$code" python3 -I -S -B - <<'PYCODE'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'context32-prepare-runtime/COMMAND_EXIT.json'
          path.write_text(json.dumps({'exit_code': int(os.environ['CODE']), 'retry_count': 0}) + '\n')
          PYCODE
          exit "$code"
      - name: Independently read the new source packet and expose readiness
        id: readback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/context32-source/FILES.json"; then
            python3 -I -S -B automation/english_kokoro_context32_once.py \
              --plan automation/english_kokoro_context32_plan.json --source-readback \
              --source "$RUNNER_TEMP/context32-source" \
              > "$RUNNER_TEMP/context32-prepare-runtime/SOURCE_READBACK.json"
            python3 -I -S -B - <<'PYCODE'
          import json, os, pathlib
          result = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'context32-prepare-runtime/SOURCE_READBACK.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('source_ready=' + str(result['source_ready']).lower() + '\n')
          PYCODE
          else
            echo 'source_ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain original closures and all sixteen derivative receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro-context32-source
          path: ${{ runner.temp }}/context32-source/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0
      - name: Retain preparation runtime and exit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro-context32-prepare-runtime
          path: ${{ runner.temp }}/context32-prepare-runtime/
          retention-days: 30
          if-no-files-found: warn
  observe:
    needs: [source-contract, prepare]
    if: >-
      needs.prepare.outputs.source_ready == 'true' && needs.source-contract.outputs.enabled == 'true' &&
      github.repository == 'jiying2007/kws-data' && github.event.repository.private == false &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        provider: [phoneme, phoneme_lv60]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 5
        with:
          name: kokoro-context32-source
          path: ${{ runner.temp }}/context32-source
      - name: Verify the exact main guard and source handoff before installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/context32-observer-runtime"
          python3 -I -S -B automation/english_kokoro_context32_once.py \
            --plan automation/english_kokoro_context32_plan.json --guard \
            > "$RUNNER_TEMP/context32-observer-runtime/GUARD.json"
          python3 -I -S -B automation/english_kokoro_context32_once.py \
            --plan automation/english_kokoro_context32_plan.json --source-readback --source "$RUNNER_TEMP/context32-source" \
            > "$RUNNER_TEMP/context32-observer-runtime/SOURCE_READBACK.json"
      - name: Install the unchanged CPU phone runtime
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/context32-observer-venv"
          "$RUNNER_TEMP/context32-observer-venv/bin/python" -m pip install \
            --index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu \
            > "$RUNNER_TEMP/context32-observer-runtime/TORCH_INSTALL.log" 2>&1
          "$RUNNER_TEMP/context32-observer-venv/bin/python" -m pip install \
            transformers==4.46.3 numpy==1.26.4 huggingface-hub==0.36.2 \
            > "$RUNNER_TEMP/context32-observer-runtime/INSTALL.log" 2>&1
          "$RUNNER_TEMP/context32-observer-venv/bin/python" -m pip check \
            > "$RUNNER_TEMP/context32-observer-runtime/PIP_CHECK.log" 2>&1
          "$RUNNER_TEMP/context32-observer-venv/bin/python" -m pip freeze --all \
            > "$RUNNER_TEMP/context32-observer-runtime/PIP_FREEZE.txt"
      - name: Observe each complete new input once and save full logits and frame IDs
        shell: bash
        timeout-minutes: 32
        run: |
          set +e
          timeout --signal=TERM --kill-after=30s 31m "$RUNNER_TEMP/context32-observer-venv/bin/python" -I -B \
            automation/english_kokoro_context32_once.py --plan automation/english_kokoro_context32_plan.json \
            --observe '${{ matrix.provider }}' --source "$RUNNER_TEMP/context32-source" \
            --output "$RUNNER_TEMP/context32-observer" --assets "$RUNNER_TEMP/context32-private-model" \
            > "$RUNNER_TEMP/context32-observer-runtime/COMMAND_STDOUT.json" \
            2> "$RUNNER_TEMP/context32-observer-runtime/COMMAND_STDERR.log"
          code=$?
          CODE="$code" python3 -I -S -B - <<'PYCODE'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'context32-observer-runtime/COMMAND_EXIT.json'
          path.write_text(json.dumps({'exit_code': int(os.environ['CODE']), 'retry_count': 0}) + '\n')
          PYCODE
          exit "$code"
      - name: Retain every observer receipt and numerical output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro-context32-observer-${{ matrix.provider }}
          path: ${{ runner.temp }}/context32-observer/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0
      - name: Retain observer runtime and command exit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro-context32-runtime-${{ matrix.provider }}
          path: ${{ runner.temp }}/context32-observer-runtime/
          retention-days: 30
          if-no-files-found: warn
  combine:
    needs: [source-contract, prepare, observe]
    if: >-
      always() && needs.source-contract.result == 'success' && needs.source-contract.outputs.enabled == 'true' &&
      github.repository == 'jiying2007/kws-data' && github.event.repository.private == false &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 5
        with:
          name: kokoro-context32-source
          path: ${{ runner.temp }}/context32-source
      - name: Collect available observations while retaining missing providers as unknown
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 5
        with:
          pattern: kokoro-context32-observer-*
          path: ${{ runner.temp }}/context32-observers
          merge-multiple: false
      - name: Read all saved numerical evidence and retain diagnostic comparison only
        shell: bash
        timeout-minutes: 17
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/context32-observers"
          timeout --signal=TERM --kill-after=30s 16m python3 -I -S -B \
            automation/english_kokoro_context32_once.py --plan automation/english_kokoro_context32_plan.json \
            --combine --source "$RUNNER_TEMP/context32-source" --observers "$RUNNER_TEMP/context32-observers" \
            --output "$RUNNER_TEMP/context32-result"
      - name: Retain the full closed diagnostic packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-kokoro-context32-${{ github.run_id }}
          path: ${{ runner.temp }}/context32-result/
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0
