name: B21 natural metadata and prospective amendment contracts
'on':
  pull_request:
    paths:
      - 'automation/english_v6_b21_natural_metadata*'
      - 'automation/test_english_v6_b21_natural_metadata*'
      - 'automation/english_v6_b21_natural_amendment*'
      - 'automation/test_english_v6_b21_natural_amendment*'
      - 'automation/english_v6_b21_reuse_synthetic.py'
      - 'automation/test_english_v6_b21_reuse_synthetic.py'
      - 'automation/english_v6_b21_fixed_mirror_primary*'
      - 'automation/bind_b21_fixed_mirror_primary.py'
      - 'automation/test_bind_b21_fixed_mirror_primary.py'
      - 'automation/test_english_v6_b21_fixed_mirror_primary_eval.py'
      - '.github/workflows/english-v6-b21-natural-amendment*'
      - '.github/workflows/english-v6-b21-natural-metadata*'
  push:
    branches: [main]
    paths:
      - 'automation/english_v6_b21_natural_metadata*'
      - 'automation/test_english_v6_b21_natural_metadata*'
      - 'automation/english_v6_b21_natural_amendment*'
      - 'automation/test_english_v6_b21_natural_amendment*'
      - 'automation/english_v6_b21_reuse_synthetic.py'
      - 'automation/test_english_v6_b21_reuse_synthetic.py'
      - 'automation/english_v6_b21_fixed_mirror_primary*'
      - 'automation/bind_b21_fixed_mirror_primary.py'
      - 'automation/test_bind_b21_fixed_mirror_primary.py'
      - 'automation/test_english_v6_b21_fixed_mirror_primary_eval.py'
      - '.github/workflows/english-v6-b21-natural-amendment*'
      - '.github/workflows/english-v6-b21-natural-metadata*'
permissions:
  contents: read
concurrency:
  group: b21-natural-metadata-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  text-only-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - name: Verify exact original reuse, registered natural IDs and unchanged scoring gates
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python -SIB $opt automation/test_english_v6_b21_natural_metadata.py -q
            python -SIB $opt automation/test_english_v6_b21_natural_amendment.py -q
            python -SIB $opt automation/test_english_v6_b21_reuse_synthetic.py -q
            python -SIB $opt automation/test_english_v6_b21_natural_amendment_sources.py -q
            python -SIB $opt automation/test_english_v6_b21_natural_amendment_auth_origin.py -q
            python -SIB $opt automation/test_english_v6_b21_natural_amendment_auth_continuation.py -q
            python -SIB $opt automation/test_english_v6_b21_natural_amendment_replication.py -q
            python -SIB $opt automation/test_english_v6_b21_fixed_mirror_primary_eval.py -q
            python -SIB $opt automation/test_bind_b21_fixed_mirror_primary.py -q
            python -SIB $opt automation/test_english_v6_b21_fixed_mirror_quality_readback.py -q
            python -SIB $opt automation/test_english_v6_b21_fixed_mirror_downstream_routing.py -q
          done
