name: B15 TRAIN-only natural near-phonetic transcript mining
on:
  push:
    branches: [research/en-v6-b15-nearphonetic-train-20261124]
    paths: [automation/english_v6_b15_nearphonetic_train_scan.py, .github/workflows/english-v6-b15-nearphonetic-train-scan.yml]
permissions:
  contents: read
  actions: read
jobs:
  scan:
    if: github.repository == 'jiying2007/kws-data' && github.event.repository.private == false && github.run_attempt == 1 && github.event.before == 'ac3238008bf5f03fa6699ec0fa13a31ec58a3b92'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      HF_HUB_DOWNLOAD_TIMEOUT: '60'
      HF_HUB_ETAG_TIMEOUT: '30'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - name: Install pinned transcript reader
        run: python -m pip install --disable-pip-version-check 'pyarrow==19.0.1' 'huggingface-hub==0.36.2'
      - name: Verify deterministic taxonomy and bounded retry
        run: python -IB automation/english_v6_b15_nearphonetic_train_scan.py --self-test
      - name: Scan pinned TRAIN transcripts only
        run: python -IB automation/english_v6_b15_nearphonetic_train_scan.py "$RUNNER_TEMP/roster"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v6-b15-nearphonetic-train-roster-${{ github.run_id }}
          path: ${{ runner.temp }}/roster/
          retention-days: 90
          if-no-files-found: error
