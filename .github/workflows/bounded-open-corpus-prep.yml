name: Bounded local open-corpus WAV preparation (no models)

on:
  pull_request:
    paths:
      - automation/prepare_open_reference_pilot.py
      - automation/test_prepare_open_reference_pilot.py
      - automation/fetch_aishell_subset.py
      - automation/test_fetch_aishell_subset.py
      - automation/recorded_aishell_fetch.py
      - automation/run_newsource8_intake.py
      - automation/test_newsource8_intake.py
      - automation/recover_newsource8_partial.py
      - automation/test_newsource8_offline_recovery.py
      - docs/NEWSOURCE8_INTAKE_20261106.md
      - automation/D2_REFERENCE_INTAKE.md
      - automation/BOUNDED_CORPUS_PREP.md
      - .github/workflows/bounded-open-corpus-prep.yml
      - docs/BRANCH_RETENTION_20261007.json
      - README.md
  push:
    branches: [main]
    paths:
      - automation/prepare_open_reference_pilot.py
      - automation/test_prepare_open_reference_pilot.py
      - automation/fetch_aishell_subset.py
      - automation/test_fetch_aishell_subset.py
      - automation/recorded_aishell_fetch.py
      - automation/run_newsource8_intake.py
      - automation/test_newsource8_intake.py
      - automation/recover_newsource8_partial.py
      - automation/test_newsource8_offline_recovery.py
      - docs/NEWSOURCE8_INTAKE_20261106.md
      - automation/D2_REFERENCE_INTAKE.md
      - automation/BOUNDED_CORPUS_PREP.md
      - .github/workflows/bounded-open-corpus-prep.yml
      - docs/BRANCH_RETENTION_20261007.json
      - README.md

permissions:
  contents: read

jobs:
  fixture-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ffmpeg when absent on GitHub-hosted runner
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          test -x "$(command -v ffmpeg)"
      - name: Source identity, 5-second selection and bounded resampling regressions
        run: |
          set -euo pipefail
          python3 -I -S -B automation/test_prepare_open_reference_pilot.py -v
          python3 -I -S -B -O automation/test_prepare_open_reference_pilot.py -v
          python3 -I -S -B -OO automation/test_prepare_open_reference_pilot.py -v
          python3 -I -S -B automation/test_fetch_aishell_subset.py -v
          python3 -I -S -B -O automation/test_fetch_aishell_subset.py -v
          python3 -I -S -B -OO automation/test_fetch_aishell_subset.py -v
          python3 -I -S -B automation/test_newsource8_intake.py -v
          python3 -I -S -B -O automation/test_newsource8_intake.py -v
          python3 -I -S -B -OO automation/test_newsource8_intake.py -v
          python3 -I -S -B automation/test_newsource8_offline_recovery.py -v
          python3 -I -S -B -O automation/test_newsource8_offline_recovery.py -v
          python3 -I -S -B -OO automation/test_newsource8_offline_recovery.py -v
      - name: Ensure no tracked file was changed
        run: |
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain --untracked-files=no)"
