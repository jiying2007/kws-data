name: English V5 Hey Mero saved five native evidence 319-of-320 readback no inference
on:
  pull_request:
    paths:
      - automation/english_v5_mero_fresh24_saved_screen_once.py
      - automation/test_english_v5_mero_fresh24_saved_screen_once.py
      - .github/workflows/english-v5-mero-fresh24-saved-screen-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-v5-mero-fresh24-saved-screen-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v5-mero-fresh24-saved-readback-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONHASHSEED: '20261119'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact original archives, one empty ASR UNKNOWN, source roles and first-main guard under three interpreters
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_v5_mero_fresh24_saved_screen_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v5_mero_fresh24_saved_screen_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  combine-only-saved-five:
    needs: source-contract
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == '782ef6418c6915e21e816c0f3d7d61f8315eb46d' &&
      needs.source-contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify one and only saved-evidence protected main successor
        run: python3 -I -S -B automation/english_v5_mero_fresh24_saved_screen_once.py --guard
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-fresh24-original-44478554596
          run-id: 44478554596
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-original-source96
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v5-mero24-observer-qwen-44481695979
          run-id: 44481695979
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-original-five/qwen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v5-mero24-observer-whisper-44481695979
          run-id: 44481695979
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-original-five/whisper
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v5-mero24-observer-parakeet-44481695979
          run-id: 44481695979
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-original-five/parakeet
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v5-mero24-observer-xlsr-44481695979
          run-id: 44481695979
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-original-five/xlsr
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v5-mero24-observer-lv60-44481695979
          run-id: 44481695979
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-original-five/lv60
      - name: Audit six original archived ZIPs and PCM; machine tier with one empty ASR kept UNKNOWN
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v5_mero_fresh24_saved_screen_once.py --evaluate \
            --source "$RUNNER_TEMP/v5-original-source96" \
            --observers "$RUNNER_TEMP/v5-original-five" \
            --output "$RUNNER_TEMP/v5-mero-fresh24-saved-screen-$GITHUB_RUN_ID"
          test -z "$(git status --porcelain)"
      - name: Archive exact 64-clip tiered receipts or STOP; no models run in this workflow
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v5-mero-fresh24-saved-machine-screen-${{ github.run_id }}
          path: ${{ runner.temp }}/v5-mero-fresh24-saved-screen-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
