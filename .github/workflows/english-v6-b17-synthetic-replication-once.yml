name: English B17 INERT synthetic replication after authenticated actual primary PASS
'on':
  push:
    branches:
    - research/en-v6-b17-synthetic-replication-once-20261124
    paths:
    - .github/workflows/english-v6-b17-synthetic-replication-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: en-v6-b17-replication-synthetic-once
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '20261121'
  PREPARED_PARENT: __B17_SYNTHETIC_REPLICATION_MAIN_SHA__
jobs:
  sources:
    if: github.repository == 'jiying2007/kws-data' && github.event.repository.private == false && github.ref == 'refs/heads/research/en-v6-b17-synthetic-replication-once-20261124'
      && github.run_attempt == 1 && github.event.before == '__B17_SYNTHETIC_REPLICATION_MAIN_SHA__'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Authenticate actual successful primary before any replica source or model access
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python -IB automation/english_v6_b17_replication_gate.py guard "$PREPARED_PARENT" "refs/heads/research/en-v6-b17-synthetic-replication-once-20261124"
        python -IB automation/english_v6_b17_replication_gate.py fetch "$RUNNER_TEMP/primary-authorization"
    - name: Verify complete old and actual primary source ancestry; claim this one-shot replica opening
      shell: bash
      run: |
        set -euo pipefail
        python -IB automation/english_v6_b17_replication_gate.py verify "$RUNNER_TEMP/primary-authorization"
        gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=en-v6-b17-replication-synthetic-panel-opened&per_page=1" | jq -e '.total_count == 0'
        mkdir "$RUNNER_TEMP/prior-source"
        python -IB automation/english_v6_b17_replication_source.py --authorization "$RUNNER_TEMP/primary-authorization" history > "$RUNNER_TEMP/history-ids"
        while read -r aid; do gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > "$RUNNER_TEMP/prior-source/$aid.zip"; done < "$RUNNER_TEMP/history-ids"
        python -IB automation/english_v6_b17_replication_source.py --authorization "$RUNNER_TEMP/primary-authorization" history "$RUNNER_TEMP/prior-source"
        mkdir "$RUNNER_TEMP/panel-opened"
        echo "$GITHUB_RUN_ID $(git rev-parse HEAD)" > "$RUNNER_TEMP/panel-opened/STARTED"
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: en-v6-b17-replication-synthetic-panel-opened
        path: ${{ runner.temp }}/panel-opened/
        retention-days: 90
        if-no-files-found: error
    - name: Generate only the original frozen replication slots after successful primary authentication
      shell: bash
      run: |
        set -euo pipefail
        python -IB automation/english_v6_b17_replication_gate.py verify "$RUNNER_TEMP/primary-authorization"
        python -m pip install 'piper-tts==1.8.0' 'numpy==1.26.4' 'scipy==1.15.3' 'huggingface-hub==0.36.2'
        python -IB automation/english_v6_b17_replication_source.py --authorization "$RUNNER_TEMP/primary-authorization" generate "$RUNNER_TEMP/source" "$RUNNER_TEMP/prior-source"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: english-v6-b17-replication-source-${{ github.run_id }}
        path: ${{ runner.temp }}/source/
        retention-days: 90
        if-no-files-found: warn
  observers:
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        provider:
        - qwen
        - parakeet
        - xlsr
        - lv60
        - whisper
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Authenticate actual successful primary before any replica source or model access
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python -IB automation/english_v6_b17_replication_gate.py guard "$PREPARED_PARENT" "refs/heads/research/en-v6-b17-synthetic-replication-once-20261124"
        python -IB automation/english_v6_b17_replication_gate.py fetch "$RUNNER_TEMP/primary-authorization"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: english-v6-b17-replication-source-${{ github.run_id }}
        path: ${{ runner.temp }}/source
    - name: Install one pinned original unprompted ASR or native phone model
      shell: bash
      timeout-minutes: 19
      env:
        PROVIDER: ${{ matrix.provider }}
      run: |
        set -euo pipefail
        python -IB automation/english_v6_b17_replication_gate.py verify "$RUNNER_TEMP/primary-authorization"
        python -m venv "$RUNNER_TEMP/b10-native-env"
        PIP="$RUNNER_TEMP/b10-native-env/bin/pip"
        FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90"
        if [ "$PROVIDER" != "parakeet" ]; then
          if [ "$PROVIDER" = "qwen" ] || [ "$PROVIDER" = "whisper" ]; then
            "$PIP" install $FLAGS 'torch==2.9.1+cpu' 'torchaudio==2.9.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
          else
            "$PIP" install $FLAGS 'torch==2.9.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
          fi
        fi
        case "$PROVIDER" in
          qwen) "$PIP" install $FLAGS 'qwen-asr==0.0.6' 'huggingface-hub==0.36.2' ;;
          whisper) "$PIP" install $FLAGS 'openai-whisper==20250625' ;;
          parakeet) "$PIP" install $FLAGS 'huggingface-hub==0.36.2' 'hf-xet==1.2.0' ;;
          xlsr|lv60) "$PIP" install $FLAGS 'transformers==4.46.3' 'numpy==1.26.4' 'huggingface-hub==0.36.2' ;;
          *) exit 7 ;;
        esac
        "$RUNNER_TEMP/b10-native-env/bin/python" -m pip check
    - name: Observe every full original once without text hints
      shell: bash
      run: |
        set -euo pipefail
        GITHUB_SHA="$(git rev-parse HEAD)" "$RUNNER_TEMP/b10-native-env/bin/python" -IB automation/english_v6_b17_replication_source.py --authorization "$RUNNER_TEMP/primary-authorization" observe "$PROVIDER" "$RUNNER_TEMP/source" "$RUNNER_TEMP/$PROVIDER"
      env:
        PROVIDER: ${{ matrix.provider }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: b17-replication-dev-observer-${{ matrix.provider }}
        path: ${{ runner.temp }}/${{ matrix.provider }}/
        retention-days: 90
        if-no-files-found: warn
    if: github.repository == 'jiying2007/kws-data' && github.event.repository.private == false && github.ref == 'refs/heads/research/en-v6-b17-synthetic-replication-once-20261124'
      && github.run_attempt == 1 && github.event.before == '__B17_SYNTHETIC_REPLICATION_MAIN_SHA__'
  readback:
    needs: observers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Authenticate actual successful primary before any replica source or model access
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python -IB automation/english_v6_b17_replication_gate.py guard "$PREPARED_PARENT" "refs/heads/research/en-v6-b17-synthetic-replication-once-20261124"
        python -IB automation/english_v6_b17_replication_gate.py fetch "$RUNNER_TEMP/primary-authorization"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: english-v6-b17-replication-source-${{ github.run_id }}
        path: ${{ runner.temp }}/source
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: b17-replication-dev-observer-*
        path: ${{ runner.temp }}/providers
    - name: Authenticate complete native captures and freeze independent source labels
      shell: bash
      run: |
        set -euo pipefail
        for p in qwen whisper parakeet xlsr lv60; do mv "$RUNNER_TEMP/providers/b17-replication-dev-observer-$p" "$RUNNER_TEMP/providers/$p"; done
        mkdir "$RUNNER_TEMP/final"
        python -IB automation/english_v6_b17_replication_source.py --authorization "$RUNNER_TEMP/primary-authorization" screen "$RUNNER_TEMP/source" "$RUNNER_TEMP/providers" "$RUNNER_TEMP/final/SCREEN.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: english-v6-b17-replication-frozen-screen-${{ github.run_id }}
        path: ${{ runner.temp }}/final/
        retention-days: 90
        if-no-files-found: error
    if: github.repository == 'jiying2007/kws-data' && github.event.repository.private == false && github.ref == 'refs/heads/research/en-v6-b17-synthetic-replication-once-20261124'
      && github.run_attempt == 1 && github.event.before == '__B17_SYNTHETIC_REPLICATION_MAIN_SHA__'
