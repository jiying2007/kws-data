name: B23 conditional TRAIN and independent quality contracts
on:
  pull_request:
    paths:
      - automation/english_v6_b23_*
      - automation/english_v6_b23_panels/**
      - automation/test_english_v6_b23_*
      - automation/bind_b23_primary.py
      - automation/test_bind_b23_primary.py
      - .github/workflows/english-v6-b23-*
  push:
    branches: [main]
    paths:
      - automation/english_v6_b23_*
      - automation/english_v6_b23_panels/**
      - automation/test_english_v6_b23_*
      - automation/bind_b23_primary.py
      - automation/test_bind_b23_primary.py
      - .github/workflows/english-v6-b23-*
permissions:
  contents: read
jobs:
  contracts:
    if: github.repository == 'jiying2007/kws-data' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - name: Verify full deterministic metadata and fail-only original-array fixtures
        run: |
          python -SIB automation/test_english_v6_b23_source_metadata.py -v
          python -SIB automation/test_english_v6_b23_prefix_peak.py -v
          python -SIB automation/test_english_v6_b23_sources.py -v
          python -SIB automation/test_english_v6_b23_primary_eval.py -v
          python -SIB automation/test_english_v6_b23_quality_readback.py -v
          python -SIB automation/test_bind_b23_primary.py -v
      - name: Install CPU tensor fixture runtime without checkpoints or model assets
        run: python -m pip install --disable-pip-version-check --retries 0 --timeout 90 torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Verify undiluted known-silence gradient and unchanged CTC suffix
        run: python -IB automation/test_english_v6_b23_prefix_peak.py --numeric -v
