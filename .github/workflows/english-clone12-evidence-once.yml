name: Validate saved 60-clone English corpus with five blind observers once
on:
  pull_request:
    paths:
      - automation/english_clone12_evidence_plan.json
      - automation/english_clone12_observer_once.py
      - automation/english_clone12_combine_once.py
      - automation/english_clone12_admission_policy.py
      - automation/test_english_clone12_observer_once.py
      - automation/test_english_clone12_admission_policy.py
      - .github/workflows/english-clone12-evidence-once.yml
  push:
    branches: [main]
    paths: [.github/workflows/english-clone12-evidence-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-clone12-five-evidence-${{ github.event_name }}
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '20261118'
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify original source pins, dual-phone veto and locked test role floor
        shell: bash
        run: |
          set -euo pipefail
          for opts in '' '-O' '-OO'; do
            python3 -I -S -B $opts automation/english_clone12_observer_once.py --source-check
            python3 -I -S -B $opts automation/english_clone12_combine_once.py --source-check
            python3 -I -S -B $opts automation/test_english_clone12_observer_once.py -v
            python3 -I -S -B $opts automation/test_english_clone12_admission_policy.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  five-blind-observers:
    needs: source-contract
    if: >-
      github.event_name == 'push' && github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == 'eab1e99784644fb826c21794c3fc93f69fdc5bac'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        provider: [qwen, whisper, parakeet, xlsr, lv60]
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Authenticate exact first public main event and two original source artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_clone12_observer_once.py --guard
          python3 -I -S -B automation/english_clone12_observer_once.py --verify-remote
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-clone12-corpus-44257296925
          run-id: 44257296925
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-clone60
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-neutral-clone-reference12-44256271861
          run-id: 44256271861
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-neutral12
      - name: Authenticate all sixty fresh complete PCM and unchanged donor source group
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PYCODE'
          import importlib.util,os,pathlib
          path=pathlib.Path('automation/english_clone12_observer_once.py').resolve()
          spec=importlib.util.spec_from_file_location("cohort_obs",path)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          rows=m.trusted_source(pathlib.Path(os.environ["RUNNER_TEMP"])/'original-clone60',
                                pathlib.Path(os.environ["RUNNER_TEMP"])/'original-neutral12')
          assert len(rows)==60
          print("EXACT_SIXTY_ORIGINAL_NEW_PCM_AUTHENTICATED")
          PYCODE
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install one exact originally verified ASR or phoneme runtime
        shell: bash
        timeout-minutes: 18
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/observer-env"
          PIP="$RUNNER_TEMP/observer-env/bin/pip"
          FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 60"
          if [ "$PROVIDER" != "parakeet" ]; then
            if [ "$PROVIDER" = "qwen" ] || [ "$PROVIDER" = "whisper" ]; then
              "$PIP" install $FLAGS 'torch==2.9.1+cpu' 'torchaudio==2.9.1+cpu' \
                --extra-index-url https://download.pytorch.org/whl/cpu
            else
              "$PIP" install $FLAGS 'torch==2.9.1+cpu' \
                --extra-index-url https://download.pytorch.org/whl/cpu
            fi
          fi
          case "$PROVIDER" in
            qwen) "$PIP" install $FLAGS 'qwen-asr==0.0.6' 'huggingface-hub==0.36.2' ;;
            whisper) "$PIP" install $FLAGS 'openai-whisper==20250625' ;;
            parakeet) "$PIP" install $FLAGS 'huggingface-hub==0.36.2' 'hf-xet==1.2.0' ;;
            xlsr|lv60) "$PIP" install $FLAGS 'transformers==4.46.3' 'numpy==1.26.4' \
                                      'huggingface-hub==0.36.2' ;;
            *) exit 7 ;;
          esac
          "$RUNNER_TEMP/observer-env/bin/python" -m pip check
      - name: Observe original sixty PCM once without requested text or model labels
        shell: bash
        timeout-minutes: 62
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=25s 3600s \
            "$RUNNER_TEMP/observer-env/bin/python" -I -B \
            automation/english_clone12_observer_once.py --run --provider "$PROVIDER" \
            --source "$RUNNER_TEMP/original-clone60" \
            --references "$RUNNER_TEMP/original-neutral12" \
            --output "$RUNNER_TEMP/english-clone12-observer-$PROVIDER"
      - name: Retain all authentic ASR/phone evidence and missing-case failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-clone12-observer-${{ matrix.provider }}
          path: ${{ runner.temp }}/english-clone12-observer-${{ matrix.provider }}/
          retention-days: 30
          if-no-files-found: warn
  combine-evidence:
    needs: [source-contract, five-blind-observers]
    if: >-
      always() && needs.source-contract.result == 'success' &&
      github.event_name == 'push' && github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == 'eab1e99784644fb826c21794c3fc93f69fdc5bac'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact same first main execution
        run: python3 -I -S -B automation/english_clone12_observer_once.py --guard
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-clone12-corpus-44257296925
          run-id: 44257296925
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-clone60
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-neutral-clone-reference12-44256271861
          run-id: 44256271861
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-neutral12
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: english-clone12-observer-*
          path: ${{ runner.temp }}/blind-observers
          merge-multiple: false
      - name: Independently recompute saved logit CTC and derive only evidence-backed labels
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_clone12_combine_once.py --combine \
            --source "$RUNNER_TEMP/original-clone60" \
            --references "$RUNNER_TEMP/original-neutral12" \
            --observers "$RUNNER_TEMP/blind-observers" \
            --output "$RUNNER_TEMP/english-clone12-screen"
      - name: Retain exact sixty-row PASS or STOP status with full source references
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-clone12-source-screen-${{ github.run_id }}
          path: ${{ runner.temp }}/english-clone12-screen/
          retention-days: 30
          if-no-files-found: warn
