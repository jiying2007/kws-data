name: Register 12 new TRAIN readers from transcript metadata only
on:
  push:
    branches: [research/en-v6-natural-train-context24-20261123]
    paths: [.github/workflows/english-v6-train-context24-register.yml]
permissions:
  contents: read
  actions: read
jobs:
  register:
    if: github.repository == 'jiying2007/kws-data' && github.event.repository.private == false && github.run_attempt == 1 && github.event.before == 'e453896ee5029f8a56b75db85b11a8309d8e6bc4'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check 'pyarrow==19.0.1' 'huggingface-hub==0.36.2'
      - name: Read only metadata columns and register the 24 speakers and utterance identities
        run: python -IB automation/english_v6_train_context24_sources.py "$RUNNER_TEMP/roster"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: train-context24-reader-and-transcript-registry-${{ github.run_id }}
          path: ${{ runner.temp }}/roster/
          retention-days: 90
          if-no-files-found: error
