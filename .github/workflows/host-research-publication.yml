name: Host research publication integrity
on:
  pull_request:
  push:
    branches: [main, 'research/publish-host-20261009']
permissions:
  contents: read
jobs:
  retained-publication-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify archive and rejection tests without model execution
        run: |
          python3 -B research/2026-10-08-d20-d90-host-research/verify_archive.py
          python3 -B research/2026-10-08-d20-d90-host-research/test_verify_archive.py
          python3 -B research/2026-10-09-pr450-saved-trace-retention/verify.py
