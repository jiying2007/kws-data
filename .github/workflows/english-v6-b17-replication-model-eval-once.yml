name: B17 independent frozen replication after verified primary PASS
on:
  push:
    branches: [research/en-v6-b17-replication-scoring-once-20261124]
    paths: [.github/workflows/english-v6-b17-replication-model-eval-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: b17-four-model-frozen-replication-once
  cancel-in-progress: false
jobs:
  score:
    if: github.repository == 'jiying2007/kws-data' && github.event.repository.private == false && github.run_attempt == 1 && github.event.before == '__B17_PRIMARY_PASS_AND_REPLICATION_SOURCE_QA_MAIN_SHA__'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '20261120'
      PREPARED_PARENT: '__B17_PRIMARY_PASS_AND_REPLICATION_SOURCE_QA_MAIN_SHA__'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - name: Recompute genuine saved primary CTC arrays and original B14 PASS before opening replication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -IB automation/english_v6_b17_replication_gate.py fetch "$RUNNER_TEMP/b17-replica-authorization"
      - name: Authenticate same primary model archives, original replica sources and full raw source history
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -IB automation/english_v6_b17_replication_eval.py fetch
          automation/english_v6_b17_replication_inputs.json
          "$RUNNER_TEMP/b17-replica-inputs" "$RUNNER_TEMP/b17-replica-history"
          "$RUNNER_TEMP/b17-replica-authorization" --prepared-parent "$PREPARED_PARENT"
      - name: Install pinned frozen-model scoring runtime
        run: |
          python -m pip install --disable-pip-version-check --retries 2 --timeout 90 torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --retries 2 --timeout 90 numpy==1.26.4
      - name: Score only the original independent replication with all four unchanged models
        run: >-
          python -IB automation/english_v6_b17_replication_eval.py score
          automation/english_v6_b17_replication_inputs.json
          "$RUNNER_TEMP/b17-replica-inputs" "$RUNNER_TEMP/b17-replica-history"
          "$RUNNER_TEMP/b17-replica-authorization" --output "$RUNNER_TEMP/b17-replica-result"
          --prepared-parent "$PREPARED_PARENT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: english-v6-b17-full-original-replication-logits-${{ github.run_id }}
          path: ${{ runner.temp }}/b17-replica-result/
          retention-days: 90
          if-no-files-found: warn
