name: English canonical newtrain24 single real 96-step dev-only fit
on:
  pull_request:
    paths:
      - automation/english_newtrain24_real_fit_once.py
      - automation/test_english_newtrain24_real_fit_once.py
      - .github/workflows/english-newtrain24-real-fit-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-newtrain24-real-fit-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-newtrain24-real-fit-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONHASHSEED: '20261118'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject locked audio, legacy Meero and false model promotion
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_newtrain24_real_fit_once.py --source-check
            python3 -I -S -B $opt automation/test_english_newtrain24_real_fit_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  exact-eight-saved-archive-audit:
    needs: source-contract
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch previous six authenticated sources and newly reviewed 168 PCM and screen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canonical-eight-saved"
          for item in \
            'fresh24-source:14422271973' 'fresh24-screen:14429385634' \
            'fresh18-source:14429578824' 'fresh18-screen:14429884666' \
            'piper24-source:14434542792' 'piper24-screen:14436377961' \
            'newtrain24-source:14486048125' 'newtrain24-screen:14489594100'; do
            name="${item%%:*}"; id="${item#*:}"
            gh api "repos/jiying2007/kws-data/actions/artifacts/$id/zip" \
              > "$RUNNER_TEMP/canonical-eight-saved/$name.zip"
          done
      - name: Authenticate eight saved ZIP hashes, 168 full PCM and 52 train/dev machine rows without inference
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_newtrain24_real_fit_once.py --audit-inputs \
            --sources "$RUNNER_TEMP/canonical-eight-saved"
          test -z "$(git status --porcelain)"
  numeric-96-step-train-dev-only:
    needs: [source-contract, exact-eight-saved-archive-audit]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == 'cc746197ce470209ae9dadfae47c7f8c7c01e38f' &&
      needs.source-contract.result == 'success' &&
      needs.exact-eight-saved-archive-audit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Enforce one actual protected main numerical run
        run: python3 -I -S -B automation/english_newtrain24_real_fit_once.py --guard
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Download only eight pinned archive ZIPs for model consumption
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canonical-eight-numeric"
          for item in \
            'fresh24-source:14422271973' 'fresh24-screen:14429385634' \
            'fresh18-source:14429578824' 'fresh18-screen:14429884666' \
            'piper24-source:14434542792' 'piper24-screen:14436377961' \
            'newtrain24-source:14486048125' 'newtrain24-screen:14489594100'; do
            name="${item%%:*}"; id="${item#*:}"
            gh api "repos/jiying2007/kws-data/actions/artifacts/$id/zip" \
              > "$RUNNER_TEMP/canonical-eight-numeric/$name.zip"
          done
      - name: Install original CPU-only frozen-ONNX and PyTorch 96-step training stack
        shell: bash
        timeout-minutes: 17
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/newtrain96-fit-env"
          PIP="$RUNNER_TEMP/newtrain96-fit-env/bin/pip"
          FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90"
          "$PIP" install $FLAGS 'torch==2.9.1+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
          "$PIP" install $FLAGS 'numpy==1.26.4' 'onnxruntime==1.20.1' 'onnx==1.17.0'
          "$RUNNER_TEMP/newtrain96-fit-env/bin/python" -m pip check
      - name: Fetch two original 0.5.1 research feature models and validate exact byte pins
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canonical-frozen-assets"
          curl --fail --silent --show-error --location --retry 0 --connect-timeout 30 \
            --max-time 100 \
            'https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/melspectrogram.onnx' \
            -o "$RUNNER_TEMP/canonical-frozen-assets/melspectrogram.onnx"
          curl --fail --silent --show-error --location --retry 0 --connect-timeout 30 \
            --max-time 100 \
            'https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/embedding_model.onnx' \
            -o "$RUNNER_TEMP/canonical-frozen-assets/embedding_model.onnx"
          "$RUNNER_TEMP/newtrain96-fit-env/bin/python" -I -B -c \
            'import importlib.util,pathlib,os;f=pathlib.Path("automation/english_canonical_multisource_fit_once.py");s=importlib.util.spec_from_file_location("fit",f);m=importlib.util.module_from_spec(s);s.loader.exec_module(m);print(m.verify_assets(pathlib.Path(os.environ["RUNNER_TEMP"])/"canonical-frozen-assets"))'
      - name: Run one real 96-step new source head; score development only
        shell: bash
        timeout-minutes: 48
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=25s 2750s \
            "$RUNNER_TEMP/newtrain96-fit-env/bin/python" -I -B \
            automation/english_newtrain24_real_fit_once.py --execute \
            --sources "$RUNNER_TEMP/canonical-eight-numeric" \
            --assets "$RUNNER_TEMP/canonical-frozen-assets" \
            --output "$RUNNER_TEMP/canonical-newtrain96-$GITHUB_RUN_ID"
      - name: Save verified real weights, train/dev metrics or explicit STOP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-canonical-newtrain96-${{ github.run_id }}
          path: ${{ runner.temp }}/canonical-newtrain96-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
