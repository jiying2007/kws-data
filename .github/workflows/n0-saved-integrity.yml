name: n0-saved-integrity
on:
  pull_request:
    paths:
      - "research/2026-10-04-n0-deterministic-controls/**"
      - ".github/workflows/n0-saved-integrity.yml"
  push:
    branches: [main, "research/**", "codex/**"]
    paths:
      - "research/2026-10-04-n0-deterministic-controls/**"
      - ".github/workflows/n0-saved-integrity.yml"
permissions:
  contents: read
jobs:
  preserved-numeric-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify complete saved bytes without model or audio execution
        run: |
          python3 -B - <<'PY'
          import collections,hashlib,json,pathlib,zlib
          r=pathlib.Path('research/2026-10-04-n0-deterministic-controls')
          def require(v,m):
              if not v:raise ValueError(m)
          def unique(pairs):
              out={}
              for k,v in pairs:
                  require(k not in out,'duplicate JSON key');out[k]=v
              return out
          def read(b):return json.loads(b,object_pairs_hook=unique,parse_constant=lambda x:(_ for _ in ()).throw(ValueError('nonfinite JSON')))
          h=lambda b:hashlib.sha256(b).hexdigest()
          m=read((r/'EVIDENCE-MANIFEST.json').read_bytes());names=set()
          require(m['schema']=='n0-public-file-manifest-v1','manifest schema')
          for x in m['files']:
              n=x['path'];p=pathlib.PurePosixPath(n)
              require(n and not p.is_absolute() and str(p)==n and not any(t in ('.','..','') for t in p.parts) and chr(92) not in n and chr(0) not in n,'unsafe path')
              require(n not in names and n!='EVIDENCE-MANIFEST.json','duplicate/self path');names.add(n);q=r
              for t in p.parts:q=q/t;require(not q.is_symlink(),'symlink')
              require(type(x['bytes']) is int and 0<=x['bytes']<=2097152,'unbounded file')
              require(q.is_file() and q.stat().st_size==x['bytes'] and h(q.read_bytes())==x['sha256'],'file identity')
          actual=set()
          for p in r.rglob('*'):
              require(not p.is_symlink(),'symlink')
              if p.is_file():actual.add(p.relative_to(r).as_posix())
          require(actual==names|{'EVIDENCE-MANIFEST.json'},'closed inventory')
          require(sum(x['bytes'] for x in m['files'])==m['total_bytes'],'byte total')
          def unpack(name,size,digest):
              z=zlib.decompressobj(31);b=z.decompress((r/name).read_bytes(),size+1)
              require(z.eof and not z.unused_data and not z.unconsumed_tail,'invalid gzip')
              require(len(b)==size and h(b)==digest,'decoded original identity');return b
          raw=unpack('evidence/raw.jsonl.gz',4617273,'ac881e0407496a92dbcbe5ed54adc2f2367bd36478240ed093f1433c4c6be998')
          unpack('metadata/geometry.json.gz',1947411,'46c2a74c276a472167b4f80e04aa7950efa3c64e4805633f9643c9ead04e5c75')
          require(raw.endswith(b'\n') and all(raw.splitlines()),'raw EOF')
          records=[read(b) for b in raw.splitlines()];require(len(records)==6012,'records')
          require(dict(collections.Counter(x['kind'] for x in records))=={'run_start':1,'model_loaded':1,'clip_start':3,'callback':3000,'feed':3000,'finish':3,'clip_end':3,'run_end':1},'coverage')
          cb=[x for x in records if x['kind']=='callback']
          require(sum(x['selected_rows'] for x in cb)==29997 and sum(x['decoder_rows_decoded'] for x in cb)==29997,'model/search coverage')
          require(sum(len(v) for x in cb for v in x['logits'])==179982 and sum(x['state'] for x in cb)==0,'logits/events')
          s=read((r/'evidence/resource-record.public.json').read_bytes());p=read((r/'evidence/strict-probe-failure.public.json').read_bytes())
          require(s['status']=='RAW_COMPLETE_PENDING_AUDIT' and s['returncode']==0 and s['guard_stop_reason'] is None,'resource result')
          require(p['status']=='FAILED_NO_RETRY' and p['returncode']==-9 and p['candidate_runs']==0,'historical failure')
          live=[x for x in s['proc_samples'] if x['observation']=='LIVE'];require(len(live)==107 and len(s['proc_samples'])==108,'resource coverage')
          require(all(x['children'] is None and x['children_count'] is None and x['children_error']['errno']==2 and x['Threads']==1 for x in live),'resource scope')
          require(s['children_observation']=='NOT_AVAILABLE' and s['lifetime_child_absence']=='NOT_PROVEN' and s['terminal_lifetime_io']=='UNKNOWN','unknown preservation')
          print('PASS: complete saved N0 numeric evidence; strict probe remains FAILED_NO_RETRY; no acoustic or live-probe execution')
          PY
      - name: Confirm tracked evidence unchanged
        run: git diff --exit-code
