name: Native A20 public package integrity
on:
  pull_request:
    paths:
      - 'research/2026-10-03-native-a20-packages/**'
      - '.github/workflows/native-a20-package-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'research/2026-10-03-native-a20-packages/**'
      - '.github/workflows/native-a20-package-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-exact-public-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: research/2026-10-03-native-a20-packages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Invented outer transport mutation and safety tests
        run: python3 -m unittest discover -s tools -p test_restore.py -v
      - name: Restore six exact packages and verify all original logical assets
        run: python3 tools/restore.py restore . --output "$RUNNER_TEMP/native-a20-public-restored"
      - name: Original invented archive verifier tests
        run: python3 -m unittest discover -s "$RUNNER_TEMP/native-a20-public-restored/public/kws-data/research/2026-10-03-native-a20/tools" -p test_archive.py -v
