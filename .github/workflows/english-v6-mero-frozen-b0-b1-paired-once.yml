name: English V6 frozen B0 versus B1 original PCM paired model inference once
on:
  pull_request:
    paths:
      - automation/english_v6_mero_frozen_b0_b1_paired_once.py
      - automation/test_english_v6_mero_frozen_b0_b1_paired_once.py
      - .github/workflows/english-v6-mero-frozen-b0-b1-paired-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-v6-mero-frozen-b0-b1-paired-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v6-frozen-b0-b1-once-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONHASHSEED: '20261119'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: B0/B1 exact model and 6+8 accepted new DEV contracts, no PR inference
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_v6_mero_frozen_b0_b1_paired_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v6_mero_frozen_b0_b1_paired_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  original-source-audit:
    needs: source-contract
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v6-mero-prospective-dev8-original-44554345276
          run-id: 44554345276
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v6-source32
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v6-mero-prospective-dev8-saved-machine-screen-44558582911
          run-id: 44558582911
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v6-screen
      - name: Byte audit source 32, saved five observers and six qualified positive originals
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v6_mero_frozen_b0_b1_paired_once.py --audit \
            --source "$RUNNER_TEMP/v6-source32" --screen "$RUNNER_TEMP/v6-screen"
          test -z "$(git status --porcelain)"
  real-frozen-b0-b1:
    needs: [source-contract, original-source-audit]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == 'e7f3e56819b4156cec4fd965e5f0529adcc99a73' &&
      needs.source-contract.result == 'success' &&
      needs.original-source-audit.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: First genuine protected main successor, no replay or new optimizer
        run: python3 -I -S -B automation/english_v6_mero_frozen_b0_b1_paired_once.py --guard
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v6-mero-prospective-dev8-original-44554345276
          run-id: 44554345276
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v6-source32
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v6-mero-prospective-dev8-saved-machine-screen-44558582911
          run-id: 44558582911
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v6-screen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-expanded-fsmn256-44495594627
          run-id: 44495594627
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v6-B0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero43-trainonly-robust288-44546464853
          run-id: 44546464853
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v6-B1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Pinned CPU-only PyTorch and NumPy, existing weights only
        shell: bash
        timeout-minutes: 22
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/v6-frozen-venv"
          "$RUNNER_TEMP/v6-frozen-venv/bin/pip" install \
            --disable-pip-version-check --no-cache-dir --retries 0 --timeout 90 \
            'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/v6-frozen-venv/bin/pip" install \
            --disable-pip-version-check --no-cache-dir --retries 0 --timeout 90 \
            'numpy==1.26.4'
          "$RUNNER_TEMP/v6-frozen-venv/bin/python" -m pip check
      - name: Actual 14 source-reviewed original PCM x 2 exact frozen models
        shell: bash
        timeout-minutes: 28
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v6-frozen-venv/bin/python" -I -B \
            automation/english_v6_mero_frozen_b0_b1_paired_once.py --execute \
            --source "$RUNNER_TEMP/v6-source32" \
            --screen "$RUNNER_TEMP/v6-screen" \
            --b0 "$RUNNER_TEMP/v6-B0" --b1 "$RUNNER_TEMP/v6-B1" \
            --output "$RUNNER_TEMP/v6-B0-B1-paired-$GITHUB_RUN_ID"
          test -z "$(git status --porcelain)"
      - name: Retain original per-frame logits and paired conditions, including STOP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v6-B0-B1-new-DEV-${{ github.run_id }}
          path: ${{ runner.temp }}/v6-B0-B1-paired-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
