name: Automatic KWS TTS voice clone source checks
on:
  pull_request:
    paths: ['.github/workflows/auto-tts-voice-clone-20261102.yml', 'research/auto-tts-voice-clone-20261102/**', 'docs/BRANCH_RETENTION_20261007.json']
  push:
    branches: [main]
    paths: ['.github/workflows/auto-tts-voice-clone-20261102.yml', 'research/auto-tts-voice-clone-20261102/**', 'docs/BRANCH_RETENTION_20261007.json']
permissions:
  contents: read
concurrency:
  group: auto-tts-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-test:
    if: github.repository == 'jiying2007/kws-data' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Source-only no-model TTS and ASR tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/auto-tts-source"
          for mode in normal optimized stripped; do
            args=()
            case "$mode" in optimized) args=(-O);; stripped) args=(-OO);; esac
            python3 -B "${args[@]}" research/auto-tts-voice-clone-20261102/test_automation.py -v 2>&1 | tee "$RUNNER_TEMP/auto-tts-source/test-$mode.log"
          done
          python3 -B research/auto-tts-voice-clone-20261102/campaign.py --output "$RUNNER_TEMP/auto-tts-source/plan.json" --batch-id automated-ci
          test -z "$(git status --porcelain)"
      - name: Propose exact manifest-only commit; never move refs
        if: github.event_name == 'pull_request' && github.head_ref == 'research/auto-tts-voice-clone-20261102'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B research/auto-tts-voice-clone-20261102/register_sources.py --output "$RUNNER_TEMP/auto-tts-source"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: auto-tts-source-${{ github.run_id }}
          path: ${{ runner.temp }}/auto-tts-source/
          retention-days: 7
          if-no-files-found: error
