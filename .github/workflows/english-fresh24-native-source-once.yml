name: Prospective 24 fresh English source groups and Qwen clones once
on:
  pull_request:
    paths:
      - automation/english_fresh24_protocol.json
      - automation/english_fresh24_ctc_admission.py
      - automation/english_fresh24_generate_once.py
      - automation/test_english_fresh24_ctc_admission.py
      - automation/test_english_fresh24_generate_once.py
      - .github/workflows/english-fresh24-native-source-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-fresh24-native-source-once.yml]
permissions:
  contents: read
concurrency:
  group: english-fresh24-native-source-${{ github.event_name }}
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '20261118'
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prove prospective roles 12-4-4-4, excluded old groups and phone policy without models
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_fresh24_ctc_admission.py --source-check
            python3 -I -S -B $opt automation/english_fresh24_generate_once.py --source-check
            python3 -I -S -B $opt automation/test_english_fresh24_ctc_admission.py -v
            python3 -I -S -B $opt automation/test_english_fresh24_generate_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  original-fresh-donor-audio:
    needs: source-contract
    if: >-
      github.event_name == 'push' && github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == 'dfbb95f003b3845439ccbe5e5eb4cb80e58e83f8'
    runs-on: ubuntu-24.04
    timeout-minutes: 76
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Bind exact first public main predecessor before installing numeric models
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_fresh24_generate_once.py --guard
      - name: Authenticate original failed source artifact before installing or generating audio
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_fresh24_generate_once.py --verify-zero-remote
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-fresh24-neutral-44287718379
          run-id: 44287718379
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-fresh24-zero-forward
      - name: Verify exact original two-file zero-forward failure, never duplicate old TTS
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_fresh24_generate_once.py \
            --verify-zero-packet --input "$RUNNER_TEMP/original-fresh24-zero-forward"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned official Kokoro CPU and verified research runtime
        timeout-minutes: 21
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/english-fresh-kokoro-env"
          PIP="$RUNNER_TEMP/english-fresh-kokoro-env/bin/pip"
          FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90"
          "$PIP" install $FLAGS 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          "$PIP" install $FLAGS 'numpy==1.26.4' 'scipy==1.15.3' \
            'transformers==4.46.3' 'huggingface-hub==0.36.2' \
            'misaki[en]==0.9.4' 'num2words==0.5.12' \
            'loguru==0.7.3' 'spacy==3.7.5' \
            'spacy-curated-transformers==0.2.2' 'attrs==25.3.0' \
            'click==8.3.1' 'typer==0.29.1' 'typer-slim==0.24.0'
          "$PIP" install $FLAGS 'kokoro==0.9.4'
          "$RUNNER_TEMP/english-fresh-kokoro-env/bin/python" -m pip check
          "$RUNNER_TEMP/english-fresh-kokoro-env/bin/python" -I -B -c \
            'from kokoro import KModel; from misaki import en; import num2words; print("PINNED_ENGLISH_FRONTEND_IMPORT_OK")'
      - name: Execute exactly 48 real neutral native forwards for 24 fresh voice assets
        timeout-minutes: 52
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=25s 3000s \
            "$RUNNER_TEMP/english-fresh-kokoro-env/bin/python" -I -B \
            automation/english_fresh24_generate_once.py --references \
            --output "$RUNNER_TEMP/english-fresh24-neutral"
          python3 -I -S -B automation/english_fresh24_generate_once.py \
            --verify-references --input "$RUNNER_TEMP/english-fresh24-neutral"
      - name: Preserve actual fresh neutral sound, frozen source pins and STOP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-fresh24-neutral-${{ github.run_id }}
          path: ${{ runner.temp }}/english-fresh24-neutral/
          retention-days: 30
          if-no-files-found: warn
  fresh-qwen-voice-clones:
    needs: [source-contract, original-fresh-donor-audio]
    if: >-
      needs.source-contract.result == 'success' &&
      needs.original-fresh-donor-audio.result == 'success' &&
      github.event_name == 'push' && github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == 'dfbb95f003b3845439ccbe5e5eb4cb80e58e83f8'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Reauthenticate exact one-shot main generation event
        run: python3 -I -S -B automation/english_fresh24_generate_once.py --guard
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-fresh24-neutral-${{ github.run_id }}
          path: ${{ runner.temp }}/english-fresh24-neutral
      - name: Read back all twenty-four untouched speaker reference hashes before loading Qwen
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_fresh24_generate_once.py \
            --verify-references --input "$RUNNER_TEMP/english-fresh24-neutral"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned previous Qwen3-TTS CPU clone generator
        timeout-minutes: 17
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/english-fresh-qwen-env"
          PIP="$RUNNER_TEMP/english-fresh-qwen-env/bin/pip"
          FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90"
          "$PIP" install $FLAGS 'torch==2.9.1+cpu' 'torchaudio==2.9.1+cpu' \
            --extra-index-url https://download.pytorch.org/whl/cpu
          "$PIP" install $FLAGS 'qwen-tts==0.1.1' 'transformers==4.57.3'
          "$RUNNER_TEMP/english-fresh-qwen-env/bin/python" -m pip check
      - name: Generate 168 new canonical/ordinary/control WAVs in unchanged 24 groups, no retries
        timeout-minutes: 100
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=25s 5760s \
            "$RUNNER_TEMP/english-fresh-qwen-env/bin/python" -I -B \
            automation/english_fresh24_generate_once.py --clone \
            --input "$RUNNER_TEMP/english-fresh24-neutral" \
            --output "$RUNNER_TEMP/english-fresh24-clone168"
          python3 -I -S -B automation/english_fresh24_generate_once.py \
            --verify-clones --input "$RUNNER_TEMP/english-fresh24-neutral" \
            --output "$RUNNER_TEMP/english-fresh24-clone168"
      - name: Save all new untouched PCM/lineage hashes, source roles and possible partial STOP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-fresh24-clone168-${{ github.run_id }}
          path: ${{ runner.temp }}/english-fresh24-clone168/
          retention-days: 30
          if-no-files-found: warn
