name: Noncommercial research reference source contracts

on:
  pull_request:
    paths:
      - 'kws_data_contract/**'
      - 'tests/test_source*.py'
      - tests/test_reference_text.py
      - automation/research_only_bulk_ingest.py
      - automation/active_asr_weak_view.py
      - automation/research_weak_sampling.py
      - automation/reference_asr_inputs.py
      - automation/test_reference_asr_inputs.py
      - automation/reference_asr_checks.py
      - automation/test_reference_asr_checks.py
      - automation/test_active_asr_weak_view.py
      - automation/test_active_d1_weak_view.py
      - automation/test_active_d1_outcomes.py
      - automation/test_active_d1_accounted.py
      - automation/test_selective_asr_weak_view.py
      - automation/test_research_weak_sampling.py
      - automation/RESEARCH_WEAK_VIEW.md
      - automation/test_research_only_bulk_ingest.py
      - automation/open_reference_sources.py
      - research/auto-tts-voice-clone-20261102/bulk_pool.py
      - research/auto-tts-voice-clone-20261102/bulk_runner.py
      - automation/RESEARCH_ONLY_REFERENCE_SCOPE.md
      - .github/workflows/research-only-reference-intake.yml
      - docs/BRANCH_RETENTION_20261007.json
      - README.md
  push:
    branches: [main]
    paths:
      - 'kws_data_contract/**'
      - 'tests/test_source*.py'
      - tests/test_reference_text.py
      - automation/research_only_bulk_ingest.py
      - automation/active_asr_weak_view.py
      - automation/research_weak_sampling.py
      - automation/reference_asr_inputs.py
      - automation/test_reference_asr_inputs.py
      - automation/reference_asr_checks.py
      - automation/test_reference_asr_checks.py
      - automation/test_active_asr_weak_view.py
      - automation/test_active_d1_weak_view.py
      - automation/test_active_d1_outcomes.py
      - automation/test_active_d1_accounted.py
      - automation/test_selective_asr_weak_view.py
      - automation/test_research_weak_sampling.py
      - automation/RESEARCH_WEAK_VIEW.md
      - automation/test_research_only_bulk_ingest.py
      - automation/open_reference_sources.py
      - research/auto-tts-voice-clone-20261102/bulk_pool.py
      - research/auto-tts-voice-clone-20261102/bulk_runner.py
      - automation/RESEARCH_ONLY_REFERENCE_SCOPE.md
      - .github/workflows/research-only-reference-intake.yml
      - docs/BRANCH_RETENTION_20261007.json
      - README.md

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Research scope and source/voice lineage without TTS/ASR calls
        run: |
          set -euo pipefail
          python3 -S -B -m unittest discover -s tests -p 'test_source*.py' -v
          python3 -S -B -m unittest discover -s tests -p test_reference_text.py -v
          python3 -I -S -B automation/test_research_only_bulk_ingest.py -v
          python3 -I -S -B -O automation/test_research_only_bulk_ingest.py -v
          python3 -I -S -B -OO automation/test_research_only_bulk_ingest.py -v
          for weak_mode in '' '-O' '-OO'; do
            python3 -I -S -B $weak_mode automation/test_active_asr_weak_view.py -v
            python3 -I -S -B $weak_mode automation/test_active_d1_weak_view.py -v
            python3 -I -S -B $weak_mode automation/test_active_d1_outcomes.py -v
            python3 -I -S -B $weak_mode automation/test_active_d1_accounted.py -v
            python3 -I -S -B $weak_mode automation/test_selective_asr_weak_view.py -v
            python3 -I -S -B $weak_mode automation/test_research_weak_sampling.py -v
            python3 -I -S -B $weak_mode automation/test_reference_asr_inputs.py -v
            python3 -I -S -B $weak_mode automation/test_reference_asr_checks.py -v
          done
      - name: Verify no tracked mutation from source fixtures
        run: |
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain --untracked-files=no)"
