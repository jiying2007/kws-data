name: English V6 B5 saved 117-frozen-forward low-gain CTC pathology once
on:
  pull_request:
    paths:
      - automation/english_v6_b5_saved_gain_failure_once.py
      - automation/test_english_v6_b5_saved_gain_failure_once.py
      - .github/workflows/english-v6-b5-saved-gain-failure-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-v6-b5-saved-gain-failure-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v6-b5-saved-lowgain-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONHASHSEED: '20261120'
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit read-only archived B5 schema and failure-pattern tests in all interpreter modes
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_v6_b5_saved_gain_failure_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v6_b5_saved_gain_failure_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  read-existing-117-forward-evidence:
    needs: source-contract
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == '1668301a2116cabb0e78ca247ae1102b1ab25d98' &&
      needs.source-contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Download exactly one already-successful original result ZIP and validate 64-hex SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/jiying2007/kws-data/actions/artifacts/14611963808/zip > "$RUNNER_TEMP/b5-original-117.zip"
          test "$(stat -c %s "$RUNNER_TEMP/b5-original-117.zip")" = 39379
          printf '%s  %s\n' \
            '67267fcdf78535a75854645de60e7ad662aaa5016788b62e9901c1f073e9b016' \
            "$RUNNER_TEMP/b5-original-117.zip" | sha256sum --check --status
      - name: Execute saved-only per-source B4 vs B5 CTC path differential, no torch nor inference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v6_b5_saved_gain_failure_once.py --evaluate \
            --archive "$RUNNER_TEMP/b5-original-117.zip" \
            --output "$RUNNER_TEMP/b5-saved-pathology-${GITHUB_RUN_ID}"
          test -z "$(git status --porcelain)"
      - name: Publish only new saved-result forensic receipts or STOP
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v6-b5-saved-gain-pathology-${{ github.run_id }}
          path: ${{ runner.temp }}/b5-saved-pathology-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
