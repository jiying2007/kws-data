name: English V6 B3 real low-gain and 490 context C11 diagnosis once
on:
  pull_request:
    paths:
      - automation/english_v6_b3_lowgain_context_c11_once.py
      - automation/test_english_v6_b3_lowgain_context_c11_once.py
      - .github/workflows/english-v6-b3-lowgain-context-c11-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-v6-b3-lowgain-context-c11-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v6-b3-lowgain-context-${{ github.event_name }}
  cancel-in-progress: false
env:
  PYTHONHASHSEED: '20261120'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
jobs:
  source-contract:
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: data
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jiying2007/kws-pipeline
          ref: e3261e976965c52bcd0989591abab606d9cdc0e0
          path: kws-pipeline
          sparse-checkout: research/english_v5_mero
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Check pinned B3 original model, 14 source roles and 46 declared cases in three Python modes (no acoustic forwards)
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_v6_b3_lowgain_context_c11_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v6_b3_lowgain_context_c11_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
      - name: GCC and Clang original source numerical smoke with synthetic-only weights
        working-directory: data
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/kws-pipeline/research/english_v5_mero"
          for CC in gcc clang; do
            "$CC" -std=c11 -Wall -Wextra -Werror -pedantic -O2 -ffp-contract=off \
              -I "$SRC" "$SRC/mero43_stream.c" "$SRC/mero_ctc.c" \
              "$SRC/test_mero43_stream.c" -lm -o "$RUNNER_TEMP/gain-smoke-$CC"
            "$RUNNER_TEMP/gain-smoke-$CC"
          done
  real-frozen-b3-c11-gain-context:
    needs: source-contract
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == '4995bfe0813f4bd6b65fa75a9c6764b14d64bd4e' &&
      needs.source-contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: data
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jiying2007/kws-pipeline
          ref: e3261e976965c52bcd0989591abab606d9cdc0e0
          path: kws-pipeline
          sparse-checkout: research/english_v5_mero
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Prove immutable protected-main prior successful continuous run and genuine original model
        working-directory: data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v6_b3_lowgain_context_c11_once.py --guard
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v6-mero-prospective-dev8-original-44554345276
          run-id: 44554345276
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b3-gain-source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v6-mero-prospective-dev8-saved-machine-screen-44558582911
          run-id: 44558582911
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/b3-gain-screen
      - name: Download and exact SHA authenticate trained B3 model ZIP, never fit or edit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/jiying2007/kws-data/actions/artifacts/14590093798/zip > "$RUNNER_TEMP/b3-original.zip"
          test "$(stat -c %s "$RUNNER_TEMP/b3-original.zip")" = 503345
          printf '%s  %s\n' \
            '59373f0e7e5f9d4ed35d6b116cdd6f8ac8eb5abcfa1acb5311ef658c59a20e04' \
            "$RUNNER_TEMP/b3-original.zip" | sha256sum --check --status
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Pinned CPU PyTorch NumPy only for original B3 pack authentication; no optimizer
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/b3-gain-env"
          FLAGS='--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90'
          "$RUNNER_TEMP/b3-gain-env/bin/pip" install $FLAGS 'torch==2.9.1+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/b3-gain-env/bin/pip" install $FLAGS 'numpy==1.26.4'
          "$RUNNER_TEMP/b3-gain-env/bin/python" -m pip check
      - name: Real GCC Clang B3 original PCM 42 gain plus 4 predecessor cases; retain misses
        working-directory: data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 24
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 1200s \
            "$RUNNER_TEMP/b3-gain-env/bin/python" -I -B \
              automation/english_v6_b3_lowgain_context_c11_once.py --execute \
              --source "$RUNNER_TEMP/b3-gain-source" \
              --screen "$RUNNER_TEMP/b3-gain-screen" \
              --b3-zip "$RUNNER_TEMP/b3-original.zip" \
              --pipeline "$GITHUB_WORKSPACE/kws-pipeline" \
              --output "$RUNNER_TEMP/b3-gain-evidence-${GITHUB_RUN_ID}"
          test -z "$(git status --porcelain)"
      - name: Retain only receipt SHA, C11 logits summaries and audio-source IDs; no raw PCM/model
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v6-b3-gain-context-c11-${{ github.run_id }}
          path: ${{ runner.temp }}/b3-gain-evidence-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
