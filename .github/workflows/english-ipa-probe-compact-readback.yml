name: Compact and verify confirmed-IPA probe artifact once
on:
  pull_request:
    paths:
      - .github/workflows/english-ipa-probe-compact-readback.yml
      - .github/triggers/english-ipa-probe-compact-readback-20261115.json
      - .github/triggers/english-ipa-probe-compact-readback-v2-20261115.json
      - automation/english_ipa_probe_compact_readback.py
      - automation/test_english_ipa_probe_compact_readback.py
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths:
      - .github/workflows/english-ipa-probe-compact-readback.yml
      - .github/triggers/english-ipa-probe-compact-readback-20261115.json
permissions:
  contents: read
concurrency:
  group: english-ipa-probe-compact-readback-20261115-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  source-contract:
    if: github.repository == 'jiying2007/kws-data' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify compact readback on invented WAV fixtures only
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal optimized stripped; do
            args=()
            case "$mode" in optimized) args=(-O);; stripped) args=(-OO);; esac
            python3 -I -S -B "${args[@]}" automation/test_english_ipa_probe_compact_readback.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  compact-and-delete-source:
    needs: source-contract
    if: github.repository == 'jiying2007/kws-data' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download exact source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-ipa-qwen17-probe-43728096763
          run-id: 43728096763
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/english-ipa-source
      - name: Verify and compact only audio and receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_ipa_probe_compact_readback.py \
            --source "$RUNNER_TEMP/english-ipa-source" \
            --destination "$RUNNER_TEMP/english-ipa-compact"
      - name: Upload compact audio and readback receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-ipa-qwen17-probe-compact-43728096763
          path: ${{ runner.temp }}/english-ipa-compact/
          retention-days: 30
          if-no-files-found: error
      - name: Delete oversized source artifact only after compact artifact exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/jiying2007/kws-data/actions/runs/43728096763/artifacts" |
            jq -e '[.artifacts[] | select(.id==14167735482 and
              .name=="english-ipa-qwen17-probe-43728096763" and
              .digest=="sha256:35fc9ef1a76c5056d3c8307a87f9372f4d3f67412223d39c24fbc7724ee9b788"
              and .expired==false)] | length==1'
          gh api "repos/jiying2007/kws-data/actions/runs/$GITHUB_RUN_ID/artifacts" |
            jq -e '[.artifacts[] | select(.name=="english-ipa-qwen17-probe-compact-43728096763"
              and .expired==false and .size_in_bytes < 20000000)] | length==1'
          gh api --method DELETE "repos/jiying2007/kws-data/actions/artifacts/14167735482"
