name: Native A20 model core integrity
on:
  pull_request:
    paths:
      - 'research/2026-10-03-native-a20-core/**'
      - '.github/workflows/native-a20-core-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'research/2026-10-03-native-a20-core/**'
      - '.github/workflows/native-a20-core-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify exact model and training-core bytes
        working-directory: research/2026-10-03-native-a20-core
        run: python3 tools/archive.py verify . --expected-index-sha256 c9812fad12fc12e8f3a76afeeff7b0b8881f236aba640b3fc400319f3c70f0f5
      - name: Run invented-byte corruption and path-safety tests
        working-directory: research/2026-10-03-native-a20-core
        run: python3 -m unittest discover -s tools -p 'test_archive.py' -v
