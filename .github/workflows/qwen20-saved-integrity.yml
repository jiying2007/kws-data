name: qwen20-saved-integrity
on:
  pull_request:
    paths:
      - "research/2026-10-04-qwen20-descriptive/**"
      - ".github/workflows/qwen20-saved-integrity.yml"
  push:
    branches: [main, "research/**", "codex/**"]
    paths:
      - "research/2026-10-04-qwen20-descriptive/**"
      - ".github/workflows/qwen20-saved-integrity.yml"
permissions:
  contents: read
jobs:
  preserved-numeric-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify numeric archive integrity without model or audio execution
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib,zlib
          r=pathlib.Path('research/2026-10-04-qwen20-descriptive')
          def unique(pairs):
              o={}
              for k,v in pairs:
                  if k in o:raise ValueError('duplicate JSON key')
                  o[k]=v
              return o
          def read(b):
              return json.loads(b,object_pairs_hook=unique,parse_constant=lambda x:(_ for _ in ()).throw(ValueError('nonfinite JSON')))
          h=lambda b:hashlib.sha256(b).hexdigest()
          m=read((r/'EVIDENCE-MANIFEST.json').read_bytes());names=set()
          assert m['schema']=='qwen20-public-file-manifest-v1'
          for x in m['files']:
              n=x['path'];p=pathlib.PurePosixPath(n)
              assert n and not p.is_absolute() and str(p)==n and not any(t in ('.','..','') for t in p.parts) and '\\' not in n
              assert n not in names and n!='EVIDENCE-MANIFEST.json';names.add(n)
              q=r
              for t in p.parts:q=q/t;assert not q.is_symlink()
              assert q.is_file() and q.stat().st_size==x['bytes'] and h(q.read_bytes())==x['sha256']
          actual=set()
          for p in r.rglob('*'):
              assert not p.is_symlink()
              if p.is_file():actual.add(p.relative_to(r).as_posix())
          assert actual==names|{'EVIDENCE-MANIFEST.json'}
          assert sum(x['bytes'] for x in m['files'])==m['total_bytes']
          z=zlib.decompressobj(31);raw=z.decompress((r/'evidence/raw.jsonl.gz').read_bytes(),197934)
          assert z.eof and not z.unused_data and not z.unconsumed_tail
          assert len(raw)==197933 and h(raw)=='0ae1cf74a15ba2d14f8d8994ac4cf972f76153973cddb9666043757f18e11c86'
          assert raw.endswith(b'\n') and all(raw.splitlines())
          rows=[read(b) for b in raw.splitlines()];assert len(rows)==317
          cb=[x for x in rows if x['kind']=='callback']
          assert len(cb)==127 and sum(x['selected_rows'] for x in cb)==1144 and sum(x['decoder_rows_decoded'] for x in cb)==1111
          assert sum(x['state'] for x in cb)==9
          e=read((r/'evidence/execution-summary.json').read_bytes());s=read((r/'evidence/resource-record.json').read_bytes())
          assert e['status']==s['status']=='FAILED_NO_RETRY' and e['supervisor']=='FAIL'
          assert e['final_io']==e['children_observation']=='UNKNOWN_NOT_CAPTURED'
          assert e['collector_returncode']==s['returncode']==0 and e['attempts']==1 and e['retries']==0
          assert len(s['proc_samples'])==5 and all('children' not in x for x in s['proc_samples'])
          print('PASS: complete saved numeric bytes; original FAILED_NO_RETRY; no acoustic execution')
          PY
      - name: Confirm tracked evidence unchanged
        run: git diff --exit-code
