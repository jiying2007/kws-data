name: English V5 single Hey Mero causal FSMN-CTC actual training
on:
  pull_request:
    paths:
      - automation/english_v5_mero_only.json
      - automation/english_v5_mero_fsmn_ctc_once.py
      - automation/test_english_v5_mero_fsmn_ctc_once.py
      - automation/english_v5_mero_pretrained_reference_once.py
      - automation/test_english_v5_mero_pretrained_reference_once.py
      - automation/english_v5_mero_sequence_margin_student_once.py
      - automation/test_english_v5_mero_sequence_margin_student_once.py
      - automation/english_v5_mero_mono_source_audit.py
      - automation/test_english_v5_mero_mono_source_audit.py
      - .github/workflows/english-v5-mero-fsmn-ctc-once.yml
      - research/english_v5_mero_only_20261119/PLAN.md
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-v5-mero-fsmn-ctc-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v5-mono-fsmn-ctc-${{ github.event_name }}
  cancel-in-progress: true
env:
  PYTHONHASHSEED: '20261119'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify only Mero active, single-keyword CTC targets, frozen inputs and first-main guard
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_v5_mero_fsmn_ctc_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v5_mero_fsmn_ctc_once.py -v
            python3 -I -S -B $opt automation/english_v5_mero_pretrained_reference_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v5_mero_pretrained_reference_once.py -v
            python3 -I -S -B $opt automation/english_v5_mero_sequence_margin_student_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v5_mero_sequence_margin_student_once.py -v
            python3 -I -S -B $opt automation/english_v5_mero_mono_source_audit.py --source-check
            python3 -I -S -B $opt automation/test_english_v5_mero_mono_source_audit.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  authenticated-mono-snapshot:
    needs: source-contract
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reuse eight original archived source/screen ZIPs; do not regenerate audio or run any models
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mono-v5-sources"
          for item in \
            'fresh24-source:14422271973' 'fresh24-screen:14429385634' \
            'fresh18-source:14429578824' 'fresh18-screen:14429884666' \
            'piper24-source:14434542792' 'piper24-screen:14436377961' \
            'newtrain24-source:14486048125' 'newtrain24-screen:14489594100'; do
            name="${item%%:*}"; id="${item#*:}"
            gh api "repos/jiying2007/kws-data/actions/artifacts/$id/zip" \
              > "$RUNNER_TEMP/mono-v5-sources/$name.zip"
          done
      - name: Hash-check entire source and enforce new Mero-only train/dev role groups
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v5_mero_fsmn_ctc_once.py --audit-inputs \
            --sources "$RUNNER_TEMP/mono-v5-sources"
          test -z "$(git status --porcelain)"
      - name: Execute read-only mono Mero sound source recovery on original five-observer evidence
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'research/english-v5-mero-mono-source-recovery-20261119' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.run_attempt == 1
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v5_mero_mono_source_audit.py --audit \
            --sources "$RUNNER_TEMP/mono-v5-sources" \
            --output "$RUNNER_TEMP/english-v5-mero-mono-audit-${GITHUB_RUN_ID}.json"
          test -z "$(git status --porcelain)"
      - name: Preserve exact mono Mero audited source selection, zero model calls
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'research/english-v5-mero-mono-source-recovery-20261119'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v5-mero-mono-source-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/english-v5-mero-mono-audit-${{ github.run_id }}.json
          retention-days: 90
          if-no-files-found: warn
  actual-mono-ctc-fit:
    needs: [source-contract, authenticated-mono-snapshot]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == '61b2cbe28cb018ebd5a0e359a33e149bd8cb5c07' &&
      needs.source-contract.result == 'success' &&
      needs.authenticated-mono-snapshot.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: First main successor authorization, no retries or alternate text
        run: python3 -I -S -B automation/english_v5_mero_fsmn_ctc_once.py --guard
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Fetch saved eight original ZIPs for real mono research optimizer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mono-v5-train-source"
          for item in \
            'fresh24-source:14422271973' 'fresh24-screen:14429385634' \
            'fresh18-source:14429578824' 'fresh18-screen:14429884666' \
            'piper24-source:14434542792' 'piper24-screen:14436377961' \
            'newtrain24-source:14486048125' 'newtrain24-screen:14489594100'; do
            name="${item%%:*}"; id="${item#*:}"
            gh api "repos/jiying2007/kws-data/actions/artifacts/$id/zip" \
              > "$RUNNER_TEMP/mono-v5-train-source/$name.zip"
          done
      - name: Install pinned CPU-only Torch, numpy and ONNX training/export dependencies
        shell: bash
        timeout-minutes: 18
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/mono-v5-env"
          PIP="$RUNNER_TEMP/mono-v5-env/bin/pip"
          FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90"
          "$PIP" install $FLAGS 'torch==2.9.1+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
          "$PIP" install $FLAGS 'numpy==1.26.4' 'onnx==1.17.0'
          "$RUNNER_TEMP/mono-v5-env/bin/python" -m pip check
      - name: Actually optimize the V5 single-word 4-block causal FSMN-CTC for 240 steps
        shell: bash
        timeout-minutes: 46
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=25s 2650s \
            "$RUNNER_TEMP/mono-v5-env/bin/python" -I -B \
              automation/english_v5_mero_fsmn_ctc_once.py --execute \
              --sources "$RUNNER_TEMP/mono-v5-train-source" \
              --output "$RUNNER_TEMP/mono-v5-real-model-$GITHUB_RUN_ID"
      - name: Retain actual new FSMN state/ONNX/NPZ, model hash, dev results, or STOP receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v5-mero-fsmn-ctc-${{ github.run_id }}
          path: ${{ runner.temp }}/mono-v5-real-model-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn

  actual-pretrained-mero-reference:
    needs: source-contract
    # One public same-repo V5 PR, fixed English pretrained reference only.
    # It cannot retrain, change labels, open old locked audio or claim release.
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/english-v5-mero-pretrained-reference-20261119' &&
      github.event.pull_request.base.ref == 'main' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch eight immutable original source/screen archive receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v5-mero-saved"
          for item in \
            'fresh24-source:14422271973' 'fresh24-screen:14429385634' \
            'fresh18-source:14429578824' 'fresh18-screen:14429884666' \
            'piper24-source:14434542792' 'piper24-screen:14436377961' \
            'newtrain24-source:14486048125' 'newtrain24-screen:14489594100'; do
            name="${item%%:*}"; id="${item#*:}"
            gh api "repos/jiying2007/kws-data/actions/artifacts/$id/zip" \
              > "$RUNNER_TEMP/v5-mero-saved/$name.zip"
          done
          python3 -I -S -B automation/english_v5_mero_fsmn_ctc_once.py \
            --audit-inputs --sources "$RUNNER_TEMP/v5-mero-saved"
      - name: Fetch the exact existing official lexicon-backed Zh-En 3M Mero asset
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2' \
            -o "$RUNNER_TEMP/official-zh-en-3m.tar.bz2"
          test "$(stat -c %s "$RUNNER_TEMP/official-zh-en-3m.tar.bz2")" = 32885699
          printf '%s  %s\n' \
            '68447f4fbc67e70eee3a93961f36e81e98f47aef73ce7e7ca00885c6cd3616a6' \
            "$RUNNER_TEMP/official-zh-en-3m.tar.bz2" |
            sha256sum --check --status
      - name: Install pinned CPU-only official pretrained inference runtime
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/v5-mero-pretrained-env"
          "$RUNNER_TEMP/v5-mero-pretrained-env/bin/pip" install \
            --disable-pip-version-check --no-cache-dir --only-binary=:all: \
            'numpy==1.26.4' 'sherpa-onnx==1.13.8' \
            'click==8.1.8' 'pypinyin==0.55.0' 'sentencepiece==0.2.1'
          "$RUNNER_TEMP/v5-mero-pretrained-env/bin/pip" check
      - name: Actually infer pretrained English KWS on source-disjoint reviewed Hey Mero and ordinary PCM
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/v5-mero-pretrained-env/bin/python" -I -B \
            automation/english_v5_mero_pretrained_reference_once.py --execute \
            --sources "$RUNNER_TEMP/v5-mero-saved" \
            --model-archive "$RUNNER_TEMP/official-zh-en-3m.tar.bz2" \
            --output "$RUNNER_TEMP/v5-mero-pretrained-real-${GITHUB_RUN_ID}"
          test -z "$(git status --porcelain)"
      - name: Preserve actual source audit, per-clip pretrained events and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v5-mero-pretrained-real-${{ github.run_id }}
          path: ${{ runner.temp }}/v5-mero-pretrained-real-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn

  actual-mero-sequence-margin-student:
    needs: [source-contract, authenticated-mono-snapshot]
    # One bounded, real new optimizer experiment on a same-repo public PR.
    # Exposed development is diagnostic only; no product/model promotion.
    # Real first attempt completed 512 updates on run 44464214887 and FAILED quality.
    # Stop rerunning the exact same data/model on documentation updates.
    if: >-
      false &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/english-v5-mero-sequence-margin-student-20261119' &&
      github.event.pull_request.base.ref == 'main' &&
      github.run_attempt == 1 &&
      needs.source-contract.result == 'success' &&
      needs.authenticated-mono-snapshot.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reuse exactly eight original source and independent screen receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v5-mero-student-sources"
          for item in \
            'fresh24-source:14422271973' 'fresh24-screen:14429385634' \
            'fresh18-source:14429578824' 'fresh18-screen:14429884666' \
            'piper24-source:14434542792' 'piper24-screen:14436377961' \
            'newtrain24-source:14486048125' 'newtrain24-screen:14489594100'; do
            name="${item%%:*}"; id="${item#*:}"
            gh api "repos/jiying2007/kws-data/actions/artifacts/$id/zip" \
              > "$RUNNER_TEMP/v5-mero-student-sources/$name.zip"
          done
          python3 -I -S -B automation/english_v5_mero_fsmn_ctc_once.py \
            --audit-inputs --sources "$RUNNER_TEMP/v5-mero-student-sources"
      - name: Verify exact previously executed Zh-En train-only teacher evidence ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/jiying2007/kws-data/actions/artifacts/14500132512/zip' \
            > "$RUNNER_TEMP/v5-mero-teacher-proof.zip"
          printf '%s  %s\n' \
            '86fca579654cbbc17182f710392eb58069952915849c1ecef499da780ec6d7ea' \
            "$RUNNER_TEMP/v5-mero-teacher-proof.zip" |
            sha256sum --check --status
      - name: Install pinned CPU-only numeric trainer and ONNX exporter
        shell: bash
        timeout-minutes: 22
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/v5-mero-student-env"
          PIP="$RUNNER_TEMP/v5-mero-student-env/bin/pip"
          FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90"
          "$PIP" install $FLAGS 'torch==2.9.1+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
          "$PIP" install $FLAGS 'numpy==1.26.4' 'onnx==1.17.0'
          "$RUNNER_TEMP/v5-mero-student-env/bin/python" -m pip check
      - name: Execute 512 real class-balanced CTC sequence-margin student updates
        shell: bash
        timeout-minutes: 42
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=25s 2400s \
            "$RUNNER_TEMP/v5-mero-student-env/bin/python" -I -B \
              automation/english_v5_mero_sequence_margin_student_once.py --execute \
              --sources "$RUNNER_TEMP/v5-mero-student-sources" \
              --teacher-zip "$RUNNER_TEMP/v5-mero-teacher-proof.zip" \
              --output "$RUNNER_TEMP/v5-mero-student-real-${GITHUB_RUN_ID}"
          test -z "$(git status --porcelain)"
      - name: Preserve actual weights, ONNX, train receipts, dev outcomes and STOP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v5-mero-sequence-margin-student-${{ github.run_id }}
          path: ${{ runner.temp }}/v5-mero-student-real-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
