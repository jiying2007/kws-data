name: english63-native-c-mero-one-shot
on:
  pull_request:
    paths:
      - ".github/workflows/english63-native-c-real-event-once.yml"
permissions:
  contents: read
  actions: read
jobs:
  original-source-native-c-api:
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/en-mero-native-c-event-once-20261114' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout pinned native model source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jiying2007/kws-pipeline
          ref: 771d081f7a853d523838b575b16bcd723a2f7a46
          path: pipeline
          persist-credentials: false
      - name: Exact source and offline regression
        run: |
          set -euo pipefail
          test "$(git -C pipeline rev-parse HEAD)" = 771d081f7a853d523838b575b16bcd723a2f7a46
          python3 -I -S -B pipeline/research/sherpa_pcm/tests/english_original_pcm_c_parity_cases.py
          python3 -I -S -B -O pipeline/research/sherpa_pcm/tests/english_original_pcm_c_parity_cases.py
          python3 -I -S -B -OO pipeline/research/sherpa_pcm/tests/english_original_pcm_c_parity_cases.py
      - name: Download previously completed source artifacts, no new speech
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          fetch_existing() {
            curl -fsSL --retry 1 --connect-timeout 20 --max-time 240 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/jiying2007/kws-data/actions/artifacts/$1/zip" \
              -o "$2"
          }
          fetch_existing 13954744587 "$RUNNER_TEMP/original-tts.zip"
          fetch_existing 14001747172 "$RUNNER_TEMP/original-review.zip"
          fetch_existing 14093802841 "$RUNNER_TEMP/unpadded-baseline.zip"
          echo "f180004a27ea14c0575f4dd0e2a8476ca048442c76c2dcc186ede6d731cdffcc  $RUNNER_TEMP/original-tts.zip" | sha256sum -c -
          echo "4f006138eb9dcc6f856ef0e61da8dcf10034904e4e683255db302775a19a62f6  $RUNNER_TEMP/unpadded-baseline.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/original-review.zip" english63-three-evidence-review.json > "$RUNNER_TEMP/review.json"
          echo "89f20b7ac5a672840013b3cf780422dcf68451b6f5d618e8f494a0e5f5dc6b12  $RUNNER_TEMP/review.json" | sha256sum -c -
      - name: Download pinned model and actual official x64 Sherpa C runtime
        timeout-minutes: 9
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 320 \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2' \
            -o "$RUNNER_TEMP/model.tar.bz2"
          test "$(stat -c %s "$RUNNER_TEMP/model.tar.bz2")" = 32885699
          echo "68447f4fbc67e70eee3a93961f36e81e98f47aef73ce7e7ca00885c6cd3616a6  $RUNNER_TEMP/model.tar.bz2" | sha256sum -c -
          curl -fsSL --retry 2 --connect-timeout 20 --max-time 320 \
            'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-linux-x64-shared.tar.bz2' \
            -o "$RUNNER_TEMP/host.tar.bz2"
          test "$(stat -c %s "$RUNNER_TEMP/host.tar.bz2")" = 28156791
          echo "c0bdb7907d3a74bba1d55d22bf4d9fa75586cf1530614ebe88a27b9118e015c4  $RUNNER_TEMP/host.tar.bz2" | sha256sum -c -
          mkdir "$RUNNER_TEMP/runtime"
          tar -xjf "$RUNNER_TEMP/host.tar.bz2" -C "$RUNNER_TEMP/runtime"
          find "$RUNNER_TEMP/runtime" -type f -name libsherpa-onnx-c-api.so -print -quit > "$RUNNER_TEMP/libpath"
          test -s "$RUNNER_TEMP/libpath"
          c_api="$(cat "$RUNNER_TEMP/libpath")"
          ort="$(dirname "$c_api")/libonnxruntime.so"
          test -f "$ort"
          sha256sum "$c_api" "$ort" > "$RUNNER_TEMP/verified-official-inner-libraries.sha256"
          wc -c "$c_api" "$ort" > "$RUNNER_TEMP/verified-official-inner-libraries.bytes"
      - name: Compile real native C adapter with locked host runtime
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/env"
          "$RUNNER_TEMP/env/bin/pip" install --disable-pip-version-check --no-cache-dir --only-binary=:all: 'numpy==1.26.4'
          "$RUNNER_TEMP/env/bin/pip" check
          "$RUNNER_TEMP/env/bin/python" pipeline/research/sherpa_pcm/build_official_x64.py \
            --runtime-archive "$RUNNER_TEMP/host.tar.bz2" --output "$RUNNER_TEMP/native"
      - name: Real source-verified INT8 C API event partition parity
        timeout-minutes: 10
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/env/bin/python" -I -B pipeline/research/sherpa_pcm/tests/english_original_pcm_c_parity.py \
            --native-library "$RUNNER_TEMP/native/libkws_sherpa_pcm.so" \
            --build-receipt "$RUNNER_TEMP/native/build-receipt.json" \
            --tts-zip "$RUNNER_TEMP/original-tts.zip" \
            --review-json "$RUNNER_TEMP/review.json" \
            --model-archive "$RUNNER_TEMP/model.tar.bz2" \
            --baseline-archive "$RUNNER_TEMP/unpadded-baseline.zip" \
            --output "$RUNNER_TEMP/native-original-mero-result.json"
      - name: Upload machine evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english63-native-original-pcm-mero-parity
          path: |
            ${{ runner.temp }}/native/build-receipt.json
            ${{ runner.temp }}/native-original-mero-result.json
            ${{ runner.temp }}/verified-official-inner-libraries.sha256
            ${{ runner.temp }}/verified-official-inner-libraries.bytes
          if-no-files-found: error
          retention-days: 14
