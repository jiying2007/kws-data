name: English 10dB source recovery and first numerical execution
on:
  pull_request:
    paths:
      - automation/english_quality_snr10_continue.py
      - automation/english_quality_snr10_continue_plan.json
      - automation/test_english_quality_snr10_continue_*.py
      - .github/workflows/english-quality-snr10-continue-once.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/english-quality-snr10-continue-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: english-quality-snr10-continuation-20261117-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  source-contract:
    if: github.repository == 'jiying2007/kws-data' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check bounded protocol and independent signal fixtures
        run: |
          set -euo pipefail
          python3 -B automation/english_quality_snr10_continue.py --plan automation/english_quality_snr10_continue_plan.json
          python3 -B -m unittest discover -s automation -p 'test_english_quality_snr10_continue_*.py' -v
          git diff --exit-code
  quality:
    needs: source-contract
    if: >-
      github.repository == 'jiying2007/kws-data' && github.event.repository.private == false &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event.before == 'b1b70a8a0ab08cdde87868788e8a18425c7e5cca'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install fixed CPU-only numeric runtime
        timeout-minutes: 7
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==1.26.4 onnx==1.17.0 onnxruntime==1.20.1 soundfile==0.13.1
          python3 -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu torch==2.9.1+cpu
      - name: Verify consumed zero-model failure, recover fixed source, execute remaining numerical study
        timeout-minutes: 16
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python3 -B automation/english_quality_snr10_continue.py \
            --plan automation/english_quality_snr10_continue_plan.json --execute \
            --output "$RUNNER_TEMP/english-quality-snr10"
      - name: Retain full predictions, weights, mixed audio and partial evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-quality-snr10-continued-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/english-quality-snr10/evidence/
            ${{ runner.temp }}/english-quality-snr10/sources/
            ${{ runner.temp }}/english-quality-snr10/models/
            ${{ runner.temp }}/english-quality-snr10/cache/
            ${{ runner.temp }}/english-quality-snr10/audio/
            ${{ runner.temp }}/english-quality-snr10/background_tracks/
            ${{ runner.temp }}/english-quality-snr10/predictions/
          retention-days: 30
          if-no-files-found: warn
