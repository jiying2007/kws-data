name: English Kokoro48 checkpoint recovery and probe once
on:
  pull_request:
    paths:
      - .github/workflows/english-kokoro48-once.yml
      - automation/english_kokoro48_recipe.py
      - automation/english_kokoro48_generate.py
      - automation/english_kokoro48_runtime.py
      - automation/english_kokoro48_initialize.py
      - automation/test_english_kokoro48_initialize.py
      - automation/test_english_kokoro48_generate.py
      - automation/english_kokoro48_once.py
      - automation/english_kokoro48_plan.json
      - automation/test_english_kokoro48.py
      - docs/ENGLISH_KOKORO48_PROBE_20261117.md
  push:
    branches: [main]
    paths:
      - automation/english_kokoro48_plan.json
permissions:
  contents: read
  actions: read
concurrency:
  group: english-kokoro48-20261117-${{ github.event_name }}
  cancel-in-progress: false
env:
  OMP_NUM_THREADS: '4'
  MKL_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '1'
  TOKENIZERS_PARALLELISM: 'false'
  HF_HUB_DISABLE_TELEMETRY: '1'
jobs:
  source-contract:
    if: github.repository == 'jiying2007/kws-data' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.source.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the source contract without models
        id: source
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal optimized stripped; do
            args=()
            case "$mode" in optimized) args=(-O);; stripped) args=(-OO);; esac
            python3 -I -S -B "${args[@]}" automation/test_english_kokoro48.py -v
            python3 -I -S -B "${args[@]}" automation/test_english_kokoro48_generate.py -v
            python3 -I -S -B "${args[@]}" automation/test_english_kokoro48_initialize.py -v
            python3 -I -S -B "${args[@]}" automation/english_kokoro48_once.py \
              --plan automation/english_kokoro48_plan.json --source-check
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
          python3 -I -S -B - <<'PYCODE'
          import json, os, pathlib
          plan = json.loads(pathlib.Path('automation/english_kokoro48_plan.json').read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('enabled=' + str(plan['enabled']).lower() + '\n')
          PYCODE
  runtime-initialize:
    needs: source-contract
    if: >-
      github.repository == 'jiying2007/kws-data' && github.event.repository.private == false &&
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the production CPU runtime and import KModel without construction
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_kokoro48_runtime.py \
            --venv "$RUNNER_TEMP/k48-pr-runtime-venv" \
            --output "$RUNNER_TEMP/k48-pr-runtime-proof"
      - name: Construct the fixed model once and verify every checkpoint component without forward
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 11m "$RUNNER_TEMP/k48-pr-runtime-venv/bin/python" -I -B \
            automation/english_kokoro48_initialize.py \
            --output "$RUNNER_TEMP/k48-pr-initialization-proof"
      - name: Retain import-only runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro48-runtime-import-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/k48-pr-runtime-proof/
          retention-days: 30
          if-no-files-found: warn
      - name: Retain actual initialization and strict checkpoint diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro48-runtime-initialize-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/k48-pr-initialization-proof/
            !${{ runner.temp }}/k48-pr-initialization-proof/private-model/**
          retention-days: 30
          if-no-files-found: warn
  generate:
    needs: source-contract
    if: >-
      needs.source-contract.outputs.enabled == 'true' && github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      source_ready: ${{ steps.readback.outputs.source_ready }}
      valid_count: ${{ steps.readback.outputs.valid_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enforce the exact enabled main predecessor before runtime installation
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/k48-generation-runtime"
          python3 -I -S -B automation/english_kokoro48_once.py \
            --plan automation/english_kokoro48_plan.json --guard \
            > "$RUNNER_TEMP/k48-generation-runtime/GUARD.json"
      - name: Fetch the three exact previous zero-forward archives and retained recovery chain
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PYCODE'
          import json, os, pathlib, subprocess
          plan = json.loads(pathlib.Path('automation/english_kokoro48_plan.json').read_bytes())
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'k48-recovery'
          folder.mkdir(mode=0o700)
          for kind in ('source', 'runtime', 'probe'):
              pin = plan['zero_forward_checkpoint_recovery']['artifacts'][kind]
              if type(pin['id']) is not int:
                  raise ValueError('PINNED_ARTIFACT_ID')
              with (folder / (kind + '.zip')).open('xb') as stream:
                  subprocess.run(['gh', 'api', 'repos/jiying2007/kws-data/actions/artifacts/' + str(pin['id']) + '/zip'],
                      stdout=stream, check=True, timeout=60)
          PYCODE
          python3 -I -S -B automation/english_kokoro48_once.py \
            --plan automation/english_kokoro48_plan.json --verify-zero-forward-recovery \
            --recovery-source "$RUNNER_TEMP/k48-recovery/source.zip" \
            --recovery-runtime "$RUNNER_TEMP/k48-recovery/runtime.zip" \
            --recovery-probe "$RUNNER_TEMP/k48-recovery/probe.zip" \
            --output "$RUNNER_TEMP/k48-generation-runtime/RECOVERY_PRECHECK.json"
      - name: Install and import-check the exact same runtime as the public PR
        shell: bash
        timeout-minutes: 14
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_kokoro48_runtime.py \
            --venv "$RUNNER_TEMP/k48-tts-venv" \
            --output "$RUNNER_TEMP/k48-generation-runtime/installation"
      - name: Synthesize exactly the new source cells once
        shell: bash
        timeout-minutes: 17
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 16m "$RUNNER_TEMP/k48-tts-venv/bin/python" -I -B \
            automation/english_kokoro48_once.py --plan automation/english_kokoro48_plan.json \
            --generate --output "$RUNNER_TEMP/k48-source" \
            --recovery-source "$RUNNER_TEMP/k48-recovery/source.zip" \
            --recovery-runtime "$RUNNER_TEMP/k48-recovery/runtime.zip" \
            --recovery-probe "$RUNNER_TEMP/k48-recovery/probe.zip"
          k48_exit=$?
          set -e
          K48_EXIT="$k48_exit" python3 -I -S -B - <<'PYCODE'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'k48-generation-runtime/COMMAND_EXIT.json'
          p.write_text(json.dumps({'returncode': int(os.environ['K48_EXIT']), 'retry_count': 0}) + '\n')
          PYCODE
          exit "$k48_exit"
      - name: Recover the full source denominator from retained receipts
        id: readback
        if: always() && steps.guard.outcome == 'success'
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_kokoro48_once.py \
            --plan automation/english_kokoro48_plan.json --read-source \
            --source "$RUNNER_TEMP/k48-source" --output "$RUNNER_TEMP/k48-generation-runtime/SOURCE_READBACK.json"
          python3 -I -S -B - <<'PYCODE'
          import json, os, pathlib
          corpus = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'k48-generation-runtime/SOURCE_READBACK.json').read_bytes())
          count = corpus['valid_count']
          if type(count) is not int or not 0 <= count <= 48:
              raise ValueError('SOURCE_VALID_COUNT')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('source_ready=true\nvalid_count=' + str(count) + '\n')
          PYCODE
      - name: Retain every original new source and partial receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro48-source
          path: |
            ${{ runner.temp }}/k48-source/
            !${{ runner.temp }}/k48-source/private-model/**
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn
      - name: Retain generation runtime and exit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro48-generation-runtime
          path: ${{ runner.temp }}/k48-generation-runtime/
          retention-days: 30
          if-no-files-found: warn
  observe:
    needs: [source-contract, generate]
    if: >-
      always() && needs.source-contract.result == 'success' && needs.source-contract.outputs.enabled == 'true' &&
      needs.generate.outputs.source_ready == 'true' && needs.generate.outputs.valid_count != '0' && github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        provider: [qwen, whisper, parakeet, phoneme, phoneme_lv60]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PROVIDER: ${{ matrix.provider }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enforce the same first-main source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/k48-observer-runtime"
          python3 -I -S -B automation/english_kokoro48_once.py \
            --plan automation/english_kokoro48_plan.json --guard \
            > "$RUNNER_TEMP/k48-observer-runtime/GUARD.json"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 5
        with:
          name: kokoro48-source
          path: ${{ runner.temp }}/k48-source
      - name: Verify original source bytes before observer installation
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_kokoro48_once.py \
            --plan automation/english_kokoro48_plan.json --read-source --source "$RUNNER_TEMP/k48-source"
      - name: Install one pinned CPU observer runtime
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/k48-observer-venv"
          k48_pip="$RUNNER_TEMP/k48-observer-venv/bin/pip"
          trap '"$k48_pip" freeze > "$RUNNER_TEMP/k48-observer-runtime/pip-freeze.txt"' EXIT
          if [ "$PROVIDER" = parakeet ]; then
            "$k48_pip" install --disable-pip-version-check 'huggingface-hub==0.36.2' 'hf-xet==1.2.0'
          elif [ "$PROVIDER" = phoneme ] || [ "$PROVIDER" = phoneme_lv60 ]; then
            "$k48_pip" install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1+cpu'
            "$k48_pip" install --disable-pip-version-check 'transformers==4.46.3' 'huggingface-hub==0.36.2' 'numpy==1.26.4'
          else
            "$k48_pip" install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1+cpu' 'torchaudio==2.9.1+cpu'
            if [ "$PROVIDER" = qwen ]; then
              "$k48_pip" install --disable-pip-version-check 'qwen-asr==0.0.6' 'huggingface-hub==0.36.2'
            else
              "$k48_pip" install --disable-pip-version-check 'openai-whisper==20250625'
            fi
          fi
      - name: Observe only the new valid sources once with this blind provider
        shell: bash
        timeout-minutes: 63
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM --kill-after=30s 62m "$RUNNER_TEMP/k48-observer-venv/bin/python" -I -B \
            automation/english_kokoro48_once.py --plan automation/english_kokoro48_plan.json \
            --observe "$PROVIDER" --source "$RUNNER_TEMP/k48-source" --output "$RUNNER_TEMP/k48-observer"
          k48_exit=$?
          set -e
          K48_EXIT="$k48_exit" python3 -I -S -B - <<'PYCODE'
          import json, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'k48-observer-runtime/COMMAND_EXIT.json'
          p.write_text(json.dumps({'provider': os.environ['PROVIDER'], 'returncode': int(os.environ['K48_EXIT']), 'retry_count': 0}) + '\n')
          PYCODE
          exit "$k48_exit"
      - name: Retain blind captures and every partial observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro48-observer-${{ matrix.provider }}
          path: |
            ${{ runner.temp }}/k48-observer/
            !${{ runner.temp }}/k48-observer/private-model/**
          retention-days: 30
          if-no-files-found: warn
      - name: Retain observer runtime and actual exit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kokoro48-runtime-${{ matrix.provider }}
          path: ${{ runner.temp }}/k48-observer-runtime/
          retention-days: 30
          if-no-files-found: warn
  combine:
    needs: [source-contract, generate, observe]
    if: >-
      always() && needs.source-contract.result == 'success' && needs.source-contract.outputs.enabled == 'true' &&
      needs.generate.outputs.source_ready == 'true' && github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enforce the exact source execution guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_kokoro48_once.py \
            --plan automation/english_kokoro48_plan.json --guard
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 5
        with:
          name: kokoro48-source
          path: ${{ runner.temp }}/k48-source
      - name: Collect available first observations with missing providers explicit
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        timeout-minutes: 5
        with:
          pattern: kokoro48-observer-*
          merge-multiple: false
          path: ${{ runner.temp }}/k48-observers
      - name: Join fixed reference rules and separate diagnostic phones without training admission
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/k48-observers"
          python3 -I -S -B automation/english_kokoro48_once.py \
            --plan automation/english_kokoro48_plan.json --combine \
            --source "$RUNNER_TEMP/k48-source" --observers "$RUNNER_TEMP/k48-observers" \
            --output "$RUNNER_TEMP/k48-probe"
      - name: Retain the full diagnostic packet without training eligibility
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-kokoro48-probe-${{ github.run_id }}
          path: ${{ runner.temp }}/k48-probe/
          compression-level: 0
          retention-days: 30
          if-no-files-found: warn
