name: English V5 Hey Mero source96 final 6-2-2-2 machine gate no model
on:
  pull_request:
    paths:
      - automation/english_v5_mero_fresh24_full_source_gate_once.py
      - automation/test_english_v5_mero_fresh24_full_source_gate_once.py
      - .github/workflows/english-v5-mero-fresh24-full-source-gate-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-v5-mero-fresh24-full-source-gate-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v5-mero-96-complete-source-gate-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prove exact original seven artifact IDs, no model invocation and source 6-2-2-2 gates in three Python interpreter modes
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_v5_mero_fresh24_full_source_gate_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v5_mero_fresh24_full_source_gate_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  saved-six-source-only-combine:
    needs: source-contract
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == 'c0a9b44ee4aaa7fb522c1e04179d787850b9e0d3' &&
      needs.source-contract.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify no source re-split and only first post-sealed main successor
        run: python3 -I -S -B automation/english_v5_mero_fresh24_full_source_gate_once.py --guard
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-fresh24-original-44478554596
          run-id: 44478554596
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-96-source
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-fresh24-saved-machine-screen-44483128198
          run-id: 44483128198
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-96-prior-screen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v5-mero24-sealed-label-qwen-44485062398
          run-id: 44485062398
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-96-sealed/qwen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v5-mero24-sealed-label-whisper-44485062398
          run-id: 44485062398
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-96-sealed/whisper
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v5-mero24-sealed-label-parakeet-44485062398
          run-id: 44485062398
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-96-sealed/parakeet
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v5-mero24-sealed-label-xlsr-44485062398
          run-id: 44485062398
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-96-sealed/xlsr
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: v5-mero24-sealed-label-lv60-44485062398
          run-id: 44485062398
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v5-96-sealed/lv60
      - name: Rejoin immutable 96 full PCM, old 11-2 and new 4-4 original source roles under frozen five-native policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v5_mero_fresh24_full_source_gate_once.py --combine \
            --source "$RUNNER_TEMP/v5-96-source" \
            --prior "$RUNNER_TEMP/v5-96-prior-screen" \
            --observers "$RUNNER_TEMP/v5-96-sealed" \
            --output "$RUNNER_TEMP/v5-96-machine-group-audit-$GITHUB_RUN_ID"
          test -z "$(git status --porcelain)"
      - name: Archive exact full 6-2-2-2 machine source gate or STOP; never invoke any model
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v5-mero-source96-full-machine-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/v5-96-machine-group-audit-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
