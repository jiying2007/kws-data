name: Consolidated public research retention
on:
  pull_request:
  push:
    branches: [main, 'research/consolidate-public-evidence-*']
permissions:
  contents: read
jobs:
  saved-public-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test retention guard using invented bytes only
        run: python3 -B tests/test_branch_retention.py -v
      - name: Verify complete retained Git objects and working bytes
        run: python3 -B tools/verify_branch_retention.py
      - name: Verify dual-ASR public projection and fixed original inputs
        run: python3 -B research/2026-10-02-dual-asr-evidence/verify_publication.py
      - name: Verify fixed30 saved failure and recovery evidence
        run: python3 -B research/2026-10-05-fixed30-exposed-asr-regression/verify.py
      - name: Verify Qwen6 saved comparison and rejected panel
        run: python3 -B research/2026-10-05-qwen6-source-screen/verify.py
      - name: Test Qwen6 saved-evidence rejection rules
        run: python3 -B research/2026-10-05-qwen6-source-screen/test_verify.py
      - name: Confirm no tracked file was changed by verification
        run: git diff --exit-code
