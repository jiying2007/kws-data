name: Independent CTC phoneme observations on stress-aligned Piper v4 16 probes once
on:
  pull_request:
    paths:
      - .github/workflows/english-ipa-piper-v4-independent-ctc-once.yml
      - .github/triggers/english-ipa-piper-v4-independent-ctc-20261116.json
      - automation/english_piper_v4_ipa_ctc_once.py
      - automation/test_english_piper_v4_ipa_ctc_once.py
  push:
    branches: [main]
    paths:
      - .github/workflows/english-ipa-piper-v4-independent-ctc-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: english-ipa-piper-v4-first-phones-20261117-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  source-contract:
    if: github.repository == 'jiying2007/kws-data' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify phone source and single-source acquisition contract without models
        shell: bash
        run: |
          set -euo pipefail
          for mode in normal optimized stripped; do
            args=()
            case "$mode" in optimized) args=(-O);; stripped) args=(-OO);; esac
            python3 -I -S -B "${args[@]}" automation/test_english_piper_v4_ipa_ctc_once.py -v
            python3 -I -S -B "${args[@]}" automation/english_piper_v4_ipa_ctc_once.py
          done
          python3 -I -S -B - <<'CHECK'
          from pathlib import Path
          import ast, sys
          sys.path.insert(0, str(Path('automation').absolute()))
          import english_piper_v4_ipa_ctc_once as worker
          pins = worker.verify_trigger()
          source = Path('.github/workflows/english-ipa-piper-v4-independent-ctc-once.yml').read_text()
          block = source.split('      - name: Download unchanged Piper WAVs\n',1)[1].split('      - name:',1)[0]
          expected = {'name':'artifact_name', 'run-id':'run_id'}
          for key, value in expected.items():
              expression = '${' + '{ steps.source.outputs.' + value + ' }}'
              if ('          ' + key + ': ' + expression + '\n') not in block:
                  raise ValueError('DOWNLOAD_NOT_BOUND_TO_VERIFIED_SOURCE:' + key)
          if 'english-ipa-piper-probe-v3-' in block or pins['source_artifact_name'] in block:
              raise ValueError('DUPLICATED_DOWNLOAD_NAME_LITERAL')
          if pins['source_artifact_name'] != 'english-ipa-piper-probe-v4-' + str(pins['source_run_id']):
              raise ValueError('SOURCE_NAME_RUN_BINDING')
          if pins['max_new_phoneme_forwards'] != 16 or pins['binding_revision'] != 2:
              raise ValueError('UNCHANGED_SCIENTIFIC_BUDGET')
          print('SINGLE_SOURCE_DOWNLOAD_BINDING_PASS; no model or network calls')
          CHECK
          python3 -I -S -B tools/verify_branch_retention.py
  observe:
    needs: source-contract
    # Both prior main attempts stopped before model installation/forward. This is
    # the separately reviewed first successor, not a rerun of consumed audio.
    if: >-
      github.repository == 'jiying2007/kws-data' && github.event.repository.private == false &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event.before == 'cf6dbed0fb95501111820d7130bfb8ccd90e162b'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact immutable Piper artifact and publish its only download binding
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'SOURCE'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path('automation').absolute()))
          import english_piper_v4_ipa_ctc_once as worker
          pins = worker.verify_trigger()
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())
          worker.need(os.environ.get('GITHUB_ACTIONS') == 'true' and
              os.environ.get('GITHUB_REPOSITORY') == 'jiying2007/kws-data' and
              os.environ.get('GITHUB_EVENT_NAME') == 'push' and os.environ.get('GITHUB_REF') == 'refs/heads/main' and
              os.environ.get('GITHUB_RUN_ATTEMPT') == '1' and event.get('ref') == 'refs/heads/main' and
              event.get('before') == 'cf6dbed0fb95501111820d7130bfb8ccd90e162b' and
              event.get('after') == os.environ.get('GITHUB_SHA') and
              event.get('repository',{}).get('private') is False, 'EXACT_PUBLIC_MAIN_SUCCESSOR')
          raw = subprocess.check_output(['gh','api','repos/jiying2007/kws-data/actions/artifacts/' + str(pins['source_artifact_id'])],timeout=60)
          artifact = json.loads(raw)
          worker.need(artifact.get('id') == pins['source_artifact_id'] and
              artifact.get('name') == pins['source_artifact_name'] and
              artifact.get('digest') == 'sha256:' + pins['source_artifact_sha256'] and
              artifact.get('expired') is False and artifact.get('size_in_bytes') == 655892 and
              artifact.get('workflow_run',{}).get('id') == pins['source_run_id'] and
              artifact.get('workflow_run',{}).get('head_sha') == 'd577b771417f488f3f6367758a4c0864c4850f0d',
              'EXACT_PIPER_V4_SOURCE_ARTIFACT')
          with (pathlib.Path(os.environ['RUNNER_TEMP'])/'phone-source-api.json').open('xb') as f:
              f.write(raw)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('artifact_name=' + pins['source_artifact_name'] + '\nrun_id=' + str(pins['source_run_id']) + '\n')
          SOURCE
      - name: Download unchanged Piper WAVs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/piper-source
      - name: Verify all sixteen original WAVs before runtime installation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'READBACK'
          import json, os, pathlib, sys
          sys.path.insert(0, str(pathlib.Path('automation').absolute()))
          import english_piper_v4_ipa_ctc_once as worker
          root, rows = worker.source_cells(pathlib.Path(os.environ['RUNNER_TEMP'])/'piper-source')
          with (pathlib.Path(os.environ['RUNNER_TEMP'])/'phone-source-readback.json').open('x',encoding='utf-8') as f:
              json.dump({'source_count':len(rows),'original_source_status':worker.read(root/'result.json')['status'],
                  'source_wav_sha256':[r['wav_sha256'] for r in rows], 'model_forwards':0,
                  'human_gold':False,'training_admitted':False},f,sort_keys=True)
          READBACK
      - name: Install exact CPU phoneme model runtime
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/ipa-venv"
          venv="$RUNNER_TEMP/ipa-venv/bin"
          "$venv/pip" install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1+cpu"
          "$venv/pip" install --disable-pip-version-check "transformers==4.46.3" "huggingface-hub==0.36.2" "safetensors==0.4.5" "numpy==1.26.4"
          "$venv/pip" freeze > "$RUNNER_TEMP/ipa-installed-packages.txt"
      - name: Run exactly sixteen audio-only phoneme forwards
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ipa-venv/bin/python" -I -B automation/english_piper_v4_ipa_ctc_once.py \
            --execute --source-parent "$RUNNER_TEMP/piper-source" \
            --output "$RUNNER_TEMP/piper-ipa-result"
      - name: Upload only machine phone observations and package identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-ipa-piper-v4-independent-ctc-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/piper-ipa-result/result.json
            ${{ runner.temp }}/piper-ipa-result/model-lock.json
            ${{ runner.temp }}/phone-source-api.json
            ${{ runner.temp }}/phone-source-readback.json
            ${{ runner.temp }}/ipa-installed-packages.txt
          retention-days: 30
          if-no-files-found: warn
