name: A20 saved preparation integrity
on:
  pull_request:
    paths:
      - 'research/2026-10-04-a20-prepared-inputs/**'
      - '.github/workflows/a20-prepared-inputs-integrity.yml'
  push:
    branches: [main, 'research/**']
    paths:
      - 'research/2026-10-04-a20-prepared-inputs/**'
      - '.github/workflows/a20-prepared-inputs-integrity.yml'
permissions:
  contents: read
jobs:
  verify-saved-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test invented corruption and unsafe paths
        run: python3 -B -m unittest discover -s research/2026-10-04-a20-prepared-inputs/tools -v
      - name: Verify all original saved bytes offline
        run: python3 -B research/2026-10-04-a20-prepared-inputs/tools/restore.py verify research/2026-10-04-a20-prepared-inputs --expected-commit "$(git rev-parse HEAD)"
      - name: Verify tracked content unchanged
        run: git diff --exit-code
