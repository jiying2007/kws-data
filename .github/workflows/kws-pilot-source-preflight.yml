name: Source-bound KWS small-pilot preflight (no models)

on:
  pull_request:
    paths:
      - tools/kws_pilot_preflight.py
      - tests/test_kws_pilot_preflight.py
      - docs/BOUNDED_PILOT_READINESS.md
      - docs/BRANCH_RETENTION_20261007.json
      - .github/workflows/kws-pilot-source-preflight.yml
      - README.md
  push:
    branches: [main]
    paths:
      - tools/kws_pilot_preflight.py
      - tests/test_kws_pilot_preflight.py
      - docs/BOUNDED_PILOT_READINESS.md
      - docs/BRANCH_RETENTION_20261007.json
      - .github/workflows/kws-pilot-source-preflight.yml
      - README.md

permissions:
  contents: read

jobs:
  bounded-source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source balance, original file identities and native ASR asset locks
        run: |
          set -euo pipefail
          python3 -I -S -B tests/test_kws_pilot_preflight.py -v
          python3 -I -S -B -O tests/test_kws_pilot_preflight.py -v
          python3 -I -S -B -OO tests/test_kws_pilot_preflight.py -v
      - name: Ensure no tracked worktree modification
        run: |
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain --untracked-files=no)"
