name: B27 read-only replica input binding
'on':
  pull_request:
    paths:
      - tools/b27_replication_binding.py
      - tools/b27_replication_binding.json
      - tests/test_b27_replication_binding.py
      - .github/workflows/b27-replication-binding.yml
  push:
    branches:
      - research/en-v6-b27-replication-binding-ci-once-20261125
    paths:
      - .github/workflows/b27-replication-binding.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v6-b27-replication-input-binding-readonly
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ github.event.pull_request.head.sha || github.sha }}'
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Invented metadata and archive bytes only
        shell: bash
        run: |
          set -euo pipefail
          for mode in '' -O -OO; do
            python -I -S -B $mode tests/test_b27_replication_binding.py -v
          done
  bind:
    needs: contracts
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/research/en-v6-b27-replication-binding-ci-once-20261125' &&
      github.run_attempt == 1 &&
      github.event.before == '__B27_REVIEWED_REPLICATION_BINDING_PARENT__'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PREPARED_PARENT: '__B27_REVIEWED_REPLICATION_BINDING_PARENT__'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '20261125'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Bind only complete original replica inputs
        env:
          GH_TOKEN: '${{ github.token }}'
        run: >-
          python -I -S -B tools/b27_replication_binding.py
          "$RUNNER_TEMP/b27-replication-binding"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b27-replication-binding-review-${{ github.run_id }}
          path: ${{ runner.temp }}/b27-replication-binding/review/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
