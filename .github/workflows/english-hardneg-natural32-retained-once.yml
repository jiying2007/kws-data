name: English natural32 retained originals with explicit dependencies once
on:
  pull_request:
    paths:
      - automation/english_hardneg_natural32_retained_once.py
      - automation/english_hardneg_natural32_retained_plan.json
      - automation/test_english_hardneg_natural32.py
      - automation/test_english_hardneg_natural32_recovery.py
      - automation/test_english_hardneg_natural32_retained.py
      - research/english_hardneg_natural32_retained_20261117/**
      - research/english_hardneg_natural32_20261117/**
      - .github/workflows/english-hardneg-natural32-retained-once.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/english-hardneg-natural32-retained-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: english-hardneg-natural32-retained-20261117-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  source-contract:
    if: >-
      github.repository == 'jiying2007/kws-data' && github.event.repository.private == false &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate pinned source and synthetic failure contracts only
        run: |
          set -euo pipefail
          sha256sum --check <<'PINS'
          29e8678870c69e36469c754bd3eaf9fc06d49560a97f4aefc03a85041a48772b  automation/english_hardneg_natural32_retained_once.py
          800f8dfa8679c04389e23a87f1b2ad83e69fc409209eae03e15cc8f472e3694e  automation/english_hardneg_natural32_retained_plan.json
          PINS
          python3 -I -S -B automation/english_hardneg_natural32_retained_once.py --preflight
          python3 -I -S -B automation/test_english_hardneg_natural32.py -v
          python3 -I -S -B automation/test_english_hardneg_natural32_recovery.py -v
          python3 -I -S -B automation/test_english_hardneg_natural32_retained.py -v
          python3 -I -S -B research/english_hardneg_natural32_20261117/test_mine_saved_scores.py -v
          python3 -B -m unittest discover -s research/kws_unified_evidence_20261117 -p test_compare_saved.py -v
          git diff --exit-code
  natural32-retained-scan:
    needs: source-contract
    if: >-
      github.repository == 'jiying2007/kws-data' && github.event.repository.private == false &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      github.event.before == 'cb6baa703f46451af73ec2cc0f85edfd1b159874' &&
      github.event.deleted == false && github.event.forced == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Scan each original once within one supervised process group
        timeout-minutes: 21
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          sha256sum --check <<'PINS'
          29e8678870c69e36469c754bd3eaf9fc06d49560a97f4aefc03a85041a48772b  automation/english_hardneg_natural32_retained_once.py
          800f8dfa8679c04389e23a87f1b2ad83e69fc409209eae03e15cc8f472e3694e  automation/english_hardneg_natural32_retained_plan.json
          PINS
          python3 -I -S -B automation/english_hardneg_natural32_retained_once.py --execute \
            --output "$RUNNER_TEMP/english-hardneg-natural32-retained"
      - name: Retain selected originals, scores, candidates and partial receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-hardneg-natural32-retained-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/english-hardneg-natural32-retained/retained-source/
            ${{ runner.temp }}/english-hardneg-natural32-retained/evidence/
            ${{ runner.temp }}/english-hardneg-natural32-retained/source/
            ${{ runner.temp }}/english-hardneg-natural32-retained/source-metadata/
            ${{ runner.temp }}/english-hardneg-natural32-retained/selectedinputs/
            ${{ runner.temp }}/english-hardneg-natural32-retained/models/
            ${{ runner.temp }}/english-hardneg-natural32-retained/bin/
            ${{ runner.temp }}/english-hardneg-natural32-retained/installed-base/
            ${{ runner.temp }}/english-hardneg-natural32-retained/traces/
            ${{ runner.temp }}/english-hardneg-natural32-retained/scores/
            ${{ runner.temp }}/english-hardneg-natural32-retained/candidates/
            ${{ runner.temp }}/english-hardneg-natural32-retained/STARTED.json
            ${{ runner.temp }}/english-hardneg-natural32-retained/MANIFEST.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn
