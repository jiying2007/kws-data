name: English V5 Hey Mero sealed Cal and Locked source-only five native quality
on:
  pull_request:
    paths:
      - automation/english_v5_mero_fresh24_sealed_source_five_native_once.py
      - automation/test_english_v5_mero_fresh24_sealed_source_five_native_once.py
      - .github/workflows/english-v5-mero-fresh24-sealed-source-five-native-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths: [.github/workflows/english-v5-mero-fresh24-sealed-source-five-native-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v5-mero-fresh24-sealed-label-five-${{ github.event_name }}
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '20261119'
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Assert only 32 sealed calibration/locked source QA samples, never KWS or train/dev inference
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_v5_mero_fresh24_sealed_source_five_native_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v5_mero_fresh24_sealed_source_five_native_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
  exact-source-audit:
    needs: source-contract
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-fresh24-original-44478554596
          run-id: 44478554596
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/authentic-v5-mero-source96
      - name: Verify all 96 original PCM hashes and only 32 frozen CAL/LOCK source-label selections without model calls
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v5_mero_fresh24_sealed_source_five_native_once.py --audit-source \
            --source "$RUNNER_TEMP/authentic-v5-mero-source96"
          test -z "$(git status --porcelain)"
  blind-five-native:
    needs: [source-contract, exact-source-audit]
    if: >-
      github.event_name == 'push' && github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == '742dea5aab2224bdfe2ad1076237820f60ce85d4' &&
      needs.source-contract.result == 'success' &&
      needs.exact-source-audit.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        provider: [qwen, whisper, parakeet, xlsr, lv60]
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Authenticate exact original source archive and first protected main successor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v5_mero_fresh24_sealed_source_five_native_once.py --guard
          python3 -I -S -B automation/english_v5_mero_fresh24_sealed_source_five_native_once.py --verify-remote
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: english-v5-mero-fresh24-original-44478554596
          run-id: 44478554596
          repository: jiying2007/kws-data
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/authentic-v5-mero-source96
      - name: Reverify full 96 PCM and seal calibration/locked groups from all five observers
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v5_mero_fresh24_sealed_source_five_native_once.py --verify-source \
            --source "$RUNNER_TEMP/authentic-v5-mero-source96"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install one pinned original unprompted ASR or native phone model
        shell: bash
        timeout-minutes: 19
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/fresh24-v5-review-env"
          PIP="$RUNNER_TEMP/fresh24-v5-review-env/bin/pip"
          FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90"
          if [ "$PROVIDER" != "parakeet" ]; then
            if [ "$PROVIDER" = "qwen" ] || [ "$PROVIDER" = "whisper" ]; then
              "$PIP" install $FLAGS 'torch==2.9.1+cpu' 'torchaudio==2.9.1+cpu' \
                --extra-index-url https://download.pytorch.org/whl/cpu
            else
              "$PIP" install $FLAGS 'torch==2.9.1+cpu' \
                --extra-index-url https://download.pytorch.org/whl/cpu
            fi
          fi
          case "$PROVIDER" in
            qwen) "$PIP" install $FLAGS 'qwen-asr==0.0.6' 'huggingface-hub==0.36.2' ;;
            whisper) "$PIP" install $FLAGS 'openai-whisper==20250625' ;;
            parakeet) "$PIP" install $FLAGS 'huggingface-hub==0.36.2' 'hf-xet==1.2.0' ;;
            xlsr|lv60) "$PIP" install $FLAGS 'transformers==4.46.3' 'numpy==1.26.4' \
                                      'huggingface-hub==0.36.2' ;;
            *) exit 7 ;;
          esac
          "$RUNNER_TEMP/fresh24-v5-review-env/bin/python" -m pip check
      - name: Blind five independent label-only reviewers on exactly 32 CAL/LOCK full-WAV originals; no KWS evaluation
        shell: bash
        timeout-minutes: 70
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=25s 4000s \
            "$RUNNER_TEMP/fresh24-v5-review-env/bin/python" -I -B \
              automation/english_v5_mero_fresh24_sealed_source_five_native_once.py --observe --provider "$PROVIDER" \
              --source "$RUNNER_TEMP/authentic-v5-mero-source96" \
              --output "$RUNNER_TEMP/v5-mero24-sealed-label-$PROVIDER"
      - name: Preserve original unprompted ASR or whole-logit phone evidence with failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-mero24-sealed-label-${{ matrix.provider }}-${{ github.run_id }}
          path: ${{ runner.temp }}/v5-mero24-sealed-label-${{ matrix.provider }}/
          retention-days: 90
          if-no-files-found: warn
