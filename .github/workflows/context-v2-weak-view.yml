name: Context v2 native weak view

on:
  pull_request:
    paths:
      - "automation/active_context_v2_weak_view.py"
      - "automation/test_active_context_v2_weak_view.py"
      - "automation/active_asr_weak_view.py"
      - "research/auto-tts-voice-clone-20261102/**"
      - "kws_data_contract/**"
      - ".github/workflows/context-v2-weak-view.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.16"
      - run: python -I -S -B automation/test_active_context_v2_weak_view.py
      - run: python -I -S -B -O automation/test_active_context_v2_weak_view.py
      - run: python -I -S -B -OO automation/test_active_context_v2_weak_view.py
