name: English V6 B4 fresh 496-503 unseen-source DEV WAV after frozen B4 once
on:
  pull_request:
    paths:
      - automation/english_v6_b4_fresh_dev496_source_plan.json
      - automation/english_v6_b4_fresh_dev496_source_once.py
      - automation/test_english_v6_b4_fresh_dev496_source_once.py
      - .github/workflows/english-v6-b4-fresh-dev496-source-once.yml
      - docs/BRANCH_RETENTION_20261007.json
  push:
    branches: [main]
    paths:
      - .github/workflows/english-v6-b4-fresh-dev496-source-once.yml
permissions:
  contents: read
concurrency:
  group: english-v6-b4-fresh-dev496-source-${{ github.event_name }}
  cancel-in-progress: false
env:
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '2'
  PYTHONHASHSEED: '20261119'
jobs:
  source-contract:
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Freeze 8 genuinely unused prospective-development-source speaker indices 496..503 and exactly 32 source requests in three interpreter modes
        shell: bash
        run: |
          set -euo pipefail
          for opt in '' '-O' '-OO'; do
            python3 -I -S -B $opt automation/english_v6_b4_fresh_dev496_source_once.py --source-check
            python3 -I -S -B $opt automation/test_english_v6_b4_fresh_dev496_source_once.py -v
          done
          python3 -I -S -B tools/verify_branch_retention.py
          test -z "$(git status --porcelain)"
      - name: Live proof B4 control/challenger weights frozen before any new speaker WAV
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/jiying2007/kws-data/actions/runs/44665669003 \
            | python3 -I -S -B -c 'import json,sys; v=json.load(sys.stdin); assert v["id"]==44665669003 and v["head_sha"]=="bcdb6c94d262d40148580c1886ac3856c53c18d5" and v["status"]=="completed" and v["conclusion"]=="success" and v["event"]=="push" and v["run_attempt"]==1'
          gh api repos/jiying2007/kws-data/actions/artifacts/14597862669 \
            | python3 -I -S -B -c 'import json,sys; v=json.load(sys.stdin); assert v["id"]==14597862669 and v["workflow_run"]["id"]==44665669003 and v["digest"]=="sha256:6eba8013da5ef06aa5046eab3f8d48b912af5f80941d98f94d0affae23764cb2" and v["size_in_bytes"]==1000659 and not v["expired"]'
  exact-speaker-map:
    needs: source-contract
    if: >-
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Authenticate exact official 20KB 904-speaker map and previously unused eight human ID ancestry; no models
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mero-piper-preflight-env"
          "$RUNNER_TEMP/mero-piper-preflight-env/bin/pip" install \
            --disable-pip-version-check --no-cache-dir --retries 0 \
            'huggingface-hub==0.36.2'
          "$RUNNER_TEMP/mero-piper-preflight-env/bin/python" -I -c \
            'from huggingface_hub import hf_hub_download; import shutil,sys; shutil.copyfile(hf_hub_download(repo_id="rhasspy/piper-voices",revision="de3dcfdf1912bb49726dc4aa11c26017ce2ac62a",filename="en/en_US/libritts/high/en_US-libritts-high.onnx.json",token=False),sys.argv[1])' \
            "$RUNNER_TEMP/piper-libritts-pinned-config.json"
          python3 -I -S -B automation/english_v6_b4_fresh_dev496_source_once.py \
            --preflight-config \
            --model-config "$RUNNER_TEMP/piper-libritts-pinned-config.json"
          test -z "$(git status --porcelain)"
  actual-fresh-original-wavs:
    needs: [source-contract, exact-speaker-map]
    # Never infer/generate new audio on a PR; one real protected public-main
    # push after this exact pre-audio code review. The original speakers and
    # role assignments are frozen BEFORE any new acoustic outcome.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'jiying2007/kws-data' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.before == 'bcdb6c94d262d40148580c1886ac3856c53c18d5' &&
      needs.source-contract.result == 'success' &&
      needs.exact-speaker-map.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 78
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact first public main successor after frozen frozen 384-step B4 paired training and 32 novel prospective-development-source requests
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B automation/english_v6_b4_fresh_dev496_source_once.py --guard
          python3 -I -S -B automation/english_v6_b4_fresh_dev496_source_once.py --source-check
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install previously measured Piper v1.8.0 CPU engine and pinned source runtime
        shell: bash
        timeout-minutes: 19
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mero-piper-fresh-env"
          PIP="$RUNNER_TEMP/mero-piper-fresh-env/bin/pip"
          FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90"
          "$PIP" install $FLAGS 'piper-tts==1.8.0' \
            'numpy==1.26.4' 'scipy==1.15.3' 'huggingface-hub==0.36.2'
          "$RUNNER_TEMP/mero-piper-fresh-env/bin/python" -m pip check
      - name: Execute exactly 32 NEW Piper full-waveform source forwards, never regenerate old 96; no retries
        shell: bash
        timeout-minutes: 51
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 2940s \
            "$RUNNER_TEMP/mero-piper-fresh-env/bin/python" -I -B \
              automation/english_v6_b4_fresh_dev496_source_once.py --generate \
              --output "$RUNNER_TEMP/b4-prospective-dev496-source-${GITHUB_RUN_ID}"
          python3 -I -S -B automation/english_v6_b4_fresh_dev496_source_once.py \
            --readback \
            --output "$RUNNER_TEMP/b4-prospective-dev496-source-${GITHUB_RUN_ID}"
          test -z "$(git status --porcelain)"
      - name: Archive exactly 32 new prospective development-role original WAVs and SHA, or explicit STOP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v6-b4-fresh-dev496-original-${{ github.run_id }}
          path: ${{ runner.temp }}/b4-prospective-dev496-source-${{ github.run_id }}/
          retention-days: 90
          if-no-files-found: warn
