name: B28 natural suffix no-event phase after complete original B27 NO_PROMOTION
on:
  push:
    branches: [research/en-v6-b28-natural-event-train-once-20261125]
    paths: [.github/workflows/english-v6-b28-natural-event-train-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: english-v6-b28-one-natural-event-first-fit
  cancel-in-progress: false
jobs:
  train:
    if: github.repository == 'jiying2007/kws-data' && github.event.repository.private == false && github.run_attempt == 1 && github.event.before == '__B28_REVIEWED_NATURAL_EVENT_PARENT__'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '20261120'
      PREPARED_PARENT: '__B28_REVIEWED_NATURAL_EVENT_PARENT__'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 2}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: {python-version: '3.12'}
      - name: Check frozen natural-only objective and capture complete original dependencies
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python -SIB automation/test_english_v6_b27_primary_no_promotion_readback.py -v
          python -SIB automation/test_english_v6_b28_train.py -v
          python -SIB automation/test_english_v6_b28_natural_event_fit.py -v
          python -SIB automation/test_english_v6_b28_objective_readback.py -v
          python -SIB automation/test_english_v6_b28_source_metadata.py -v
          python -SIB automation/test_english_v6_b28_training_readback.py -v
          python -SIB automation/english_v6_b28_producer.py "$RUNNER_TEMP/b28-producer" --prepared-parent "$PREPARED_PARENT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v6-b28-train-producer-${{ github.run_id }}
          path: ${{ runner.temp }}/b28-producer/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Reauthenticate complete B27 failure and all59 external originals; retain exact original B24 control
        env: {GH_TOKEN: '${{ github.token }}'}
        working-directory: ${{ runner.temp }}/b28-producer/repository
        run: python -SIB automation/english_v6_b28_train.py fetch --inputs "$RUNNER_TEMP/b28-inputs" --prepared-parent "$PREPARED_PARENT"
      - name: Install only array reader before complete actual source admission
        run: python -m pip install --disable-pip-version-check --retries 0 --timeout 90 numpy==1.26.4
      - name: Authenticate complete B27 failure, fresh72 exclusions and frozen preoptimizer budget
        env: {GH_TOKEN: '${{ github.token }}'}
        working-directory: ${{ runner.temp }}/b28-producer/repository
        run: python -IB automation/english_v6_b28_train.py consume --inputs "$RUNNER_TEMP/b28-inputs" --prepared-parent "$PREPARED_PARENT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: english-v6-b28-natural-event-train-consumed
          path: ${{ runner.temp }}/b28-inputs/CONSUMPTION.json
          retention-days: 90
          if-no-files-found: error
      - name: Install pinned original CPU training runtime after frozen source admission
        run: |
          python -m pip install --disable-pip-version-check --retries 0 --timeout 90 torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --retries 0 --timeout 90 onnx==1.17.0
      - name: Fit one192-step natural-event phase from B23 with fresh AdamW and preserve every return
        env: {GH_TOKEN: '${{ github.token }}'}
        working-directory: ${{ runner.temp }}/b28-producer/repository
        run: python -IB automation/english_v6_b28_train.py execute --inputs "$RUNNER_TEMP/b28-inputs" --output "$RUNNER_TEMP/b28-models" --prepared-parent "$PREPARED_PARENT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: english-v6-b28-natural-event-models-${{ github.run_id }}
          path: ${{ runner.temp }}/b28-models/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: english-v6-b28-original-input-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/b28-inputs/FETCH.json
            ${{ runner.temp }}/b28-inputs/SOURCE_PREFLIGHT.json
            ${{ runner.temp }}/b28-inputs/CONSUMPTION.json
            ${{ runner.temp }}/b28-inputs/EXTERNAL_INPUTS.json
            ${{ runner.temp }}/b28-inputs/original_b24/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
