name: English B24Q1 approved successful-empty quarantine primary sources with fixed B24 weights
'on':
  pull_request:
    paths:
    - automation/*b24q1*
    - automation/english_v6_b24q1_panels/**
    - research/english_v6_b24q1_preparation_20261125/**
    - .github/workflows/english-v6-b24q1-primary-sources-once.yml
  push:
    branches:
    - research/en-v6-b24q1-primary-sources-once-20261125
    paths:
    - .github/workflows/english-v6-b24q1-primary-sources-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: en-v6-b24q1-primary-120-once
  cancel-in-progress: false
env:
  PREPARED_PARENT: '__B24Q1_REVIEWED_SOURCE_PARENT__'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '20261124'
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Offline approval, whole-original quarantine and complete dependency contracts
      run: |
        set -euo pipefail
        for mode in '' -O -OO; do
          for test in automation/test_english_v6_b24q1_source_metadata.py automation/test_english_v6_b24q1_source_ancestry.py automation/test_english_v6_b24q1_capacity.py automation/test_english_v6_b24q1_evidence_scope.py automation/test_english_v6_b24q1_r1_git_transport.py automation/test_english_v6_b24q1_quarantine.py automation/test_english_v6_b24q1_source_contract.py automation/test_english_v6_b24q1_source_entry.py automation/test_english_v6_b24q1_r1_source_failure.py; do
            python -SIB $mode "$test" -v
          done
        done
    - name: Read-only exact original API and failed-job-log transport preflight
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -SIB automation/english_v6_b24q1_r1_source_failure.py check-live-metadata
  sources:
    needs: contracts
    if: github.event_name == 'push' && github.repository == 'jiying2007/kws-data' && github.event.repository.private == false && github.ref == 'refs/heads/research/en-v6-b24q1-primary-sources-once-20261125' && github.run_attempt == 1 && github.event.before == '__B24Q1_REVIEWED_SOURCE_PARENT__'
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Capture exact Git-bound scientific producer
      run: |
        python -IB automation/english_v6_b24q1_source_producer.py "$RUNNER_TEMP/b24q1-source-producer" --prepared-parent "$PREPARED_PARENT"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: english-v6-b24q1-primary-source-producer-${{ github.run_id }}
        path: ${{ runner.temp }}/b24q1-source-producer/
        include-hidden-files: true
        retention-days: 90
        if-no-files-found: error
    - name: Authenticate approval, original B24 TRAIN and all14 original R1 SOURCE STOP artifacts before new sources
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" guard "$PREPARED_PARENT"
        python -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" check
        python -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" authorize "$RUNNER_TEMP/prior-source" "$PREPARED_PARENT"
    - name: Fetch the complete identical corpus over eight fixed official magicdatatech ranges
      shell: bash
      timeout-minutes: 47
      env:
        GH_TOKEN: ${{ github.token }}
      run: python -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" transport "$RUNNER_TEMP/train-clean-100.tar.gz" "$RUNNER_TEMP/prior-source" "$PREPARED_PARENT"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: english-v6-b24q1-primary-transport-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/prior-source/TRANSPORT/
          ${{ runner.temp }}/prior-source/CORPUS_TRANSPORT.json
          ${{ runner.temp }}/prior-source/AUTHORIZATION.json
          ${{ runner.temp }}/prior-source/HISTORY.json
          ${{ runner.temp }}/prior-source/TRAIN_LIVE.json
          ${{ runner.temp }}/prior-source/TRAIN_*.zip
          ${{ runner.temp }}/prior-source/B24R1_SOURCE_STOP_BINDING.json
          ${{ runner.temp }}/prior-source/B24R1_SOURCE_STOP_REPORT.json
          ${{ runner.temp }}/prior-source/R1_STOP_TRANSPORT/
        include-hidden-files: true
        retention-days: 90
        if-no-files-found: warn
    - name: Consume TTS96, natural24 and exact five-times-N observer budget after complete corpus and capacity verification
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" consume "$RUNNER_TEMP/train-clean-100.tar.gz" "$RUNNER_TEMP/prior-source" "$PREPARED_PARENT"
        mkdir "$RUNNER_TEMP/source-consumed"
        cp "$RUNNER_TEMP/prior-source/CONSUMPTION.json" "$RUNNER_TEMP/source-consumed/CONSUMPTION.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: english-v6-b24q1-primary-source-consumed
        path: ${{ runner.temp }}/source-consumed/
        include-hidden-files: true
        retention-days: 90
        if-no-files-found: error
    - name: Generate only the new frozen96 synthetic originals and decode only the committed24 whole natural originals
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check --no-cache-dir --retries 0 --timeout 90 'piper-tts==1.8.0' 'numpy==1.26.4' 'scipy==1.15.3' 'huggingface-hub==0.36.2' 'soundfile==0.13.1'
        python -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" generate "$RUNNER_TEMP/source" "$RUNNER_TEMP/prior-source" "$RUNNER_TEMP/train-clean-100.tar.gz" "$PREPARED_PARENT"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: english-v6-b24q1-primary-source-${{ github.run_id }}
        path: ${{ runner.temp }}/source/
        include-hidden-files: true
        retention-days: 90
        if-no-files-found: warn
  observers:
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        provider: [qwen, parakeet, xlsr, lv60, whisper]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: english-v6-b24q1-primary-source-producer-${{ github.run_id }}
        path: ${{ runner.temp }}/b24q1-source-producer
    - name: Check all19 captured dynamic helpers before any observer budget or model installation
      run: python -SIB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b22_source_dynamic_preflight.py"
    - name: Guard the same original source execution before model installation
      run: python -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" guard "$PREPARED_PARENT"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: english-v6-b24q1-primary-source-${{ github.run_id }}
        path: ${{ runner.temp }}/source
    - name: Read every original including natural rejects before observer installation
      run: python -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" verify-source "$RUNNER_TEMP/source"
    - name: Consume this provider's exact original-observation budget before model installation
      env:
        GH_TOKEN: ${{ github.token }}
        PROVIDER: ${{ matrix.provider }}
      run: python -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" consume-observer "$PROVIDER" "$RUNNER_TEMP/source" "$RUNNER_TEMP/observer-consumed" "$PREPARED_PARENT"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: english-v6-b24q1-primary-observer-${{ matrix.provider }}-consumed
        path: ${{ runner.temp }}/observer-consumed/
        include-hidden-files: true
        retention-days: 90
        if-no-files-found: error
    - name: Install one pinned native observer runtime
      shell: bash
      timeout-minutes: 19
      env:
        PROVIDER: ${{ matrix.provider }}
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/b24q1-native-env"
        PIP="$RUNNER_TEMP/b24q1-native-env/bin/pip"
        FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90"
        if [ "$PROVIDER" != "parakeet" ]; then
          if [ "$PROVIDER" = "qwen" ] || [ "$PROVIDER" = "whisper" ]; then
            "$PIP" install $FLAGS 'torch==2.9.1+cpu' 'torchaudio==2.9.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
          else
            "$PIP" install $FLAGS 'torch==2.9.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
          fi
        fi
        case "$PROVIDER" in
          qwen) "$PIP" install $FLAGS 'qwen-asr==0.0.6' 'huggingface-hub==0.36.2' ;;
          whisper) "$PIP" install $FLAGS 'openai-whisper==20250625' ;;
          parakeet) "$PIP" install $FLAGS 'huggingface-hub==0.36.2' 'hf-xet==1.2.0' ;;
          xlsr|lv60) "$PIP" install $FLAGS 'transformers==4.46.3' 'numpy==1.26.4' 'huggingface-hub==0.36.2' ;;
          *) exit 7 ;;
        esac
        "$RUNNER_TEMP/b24q1-native-env/bin/python" -m pip check
    - name: Save each native return and independently prove any invalid empty without changing the remaining fixed slots
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PROVIDER: ${{ matrix.provider }}
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/b24q1-native-env/bin/python" -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" observe "$PROVIDER" "$RUNNER_TEMP/source" "$RUNNER_TEMP/$PROVIDER" "$PREPARED_PARENT"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: b24q1-primary-dev-observer-${{ matrix.provider }}
        path: ${{ runner.temp }}/${{ matrix.provider }}/
        include-hidden-files: true
        retention-days: 90
        if-no-files-found: warn
  readback:
    needs: [sources, observers]
    if: always() && needs.sources.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: english-v6-b24q1-primary-source-producer-${{ github.run_id }}
        path: ${{ runner.temp }}/b24q1-source-producer
    - name: Check the complete captured dynamic dependency root without assets or audio
      run: python -SIB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b22_source_dynamic_preflight.py"
    - name: Guard original event before source readback
      run: python -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" guard "$PREPARED_PARENT"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: english-v6-b24q1-primary-source-${{ github.run_id }}
        path: ${{ runner.temp }}/source
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: b24q1-primary-dev-observer-*
        path: ${{ runner.temp }}/providers
    - name: Reopen the complete five-times-N ledger and quarantine union before unchanged numerical admission
      shell: bash
      run: |
        set -euo pipefail
        for p in qwen whisper parakeet xlsr lv60; do
          mv "$RUNNER_TEMP/providers/b24q1-primary-dev-observer-$p" "$RUNNER_TEMP/providers/$p"
        done
        mkdir "$RUNNER_TEMP/final"
        python -IB "$RUNNER_TEMP/b24q1-source-producer/repository/automation/english_v6_b24q1_source.py" screen "$RUNNER_TEMP/source" "$RUNNER_TEMP/providers" "$RUNNER_TEMP/final/SCREEN.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: english-v6-b24q1-primary-frozen-screen-${{ github.run_id }}
        path: ${{ runner.temp }}/final/
        include-hidden-files: true
        retention-days: 90
        if-no-files-found: error
