name: English B18 new 96 originals and strict five native receipts
'on':
  push:
    branches:
    - research/en-v6-b18-synthetic-primary-once-20261124
    paths:
    - .github/workflows/english-v6-b18-synthetic-primary-once.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: en-v6-b18-primary-96-once
  cancel-in-progress: false
env:
  PREPARED_PARENT: '__B18_SYNTHETIC_MAIN_SHA__'
  HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '20261124'
jobs:
  sources:
    if: github.repository == 'jiying2007/kws-data' && github.event.repository.private == false && github.ref == 'refs/heads/research/en-v6-b18-synthetic-primary-once-20261124' && github.run_attempt == 1 && github.event.before == '__B18_SYNTHETIC_MAIN_SHA__'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Authenticate original B17 STOP and natural PASS before new source access
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python -IB automation/english_v6_b18_source.py guard "$PREPARED_PARENT"
        gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=en-v6-b18-primary-panel-opened&per_page=1" | jq -e '.total_count == 0'
        python -IB automation/english_v6_b18_source.py authorize "$RUNNER_TEMP/prior-source" "$PREPARED_PARENT"
        while read -r aid; do
          if [ ! -f "$RUNNER_TEMP/prior-source/$aid.zip" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > "$RUNNER_TEMP/prior-source/$aid.zip"
          fi
        done < <(python -IB automation/english_v6_b18_source.py history)
        python -IB automation/english_v6_b18_source.py verify-history "$RUNNER_TEMP/prior-source"
        mkdir "$RUNNER_TEMP/panel-opened"
        cp "$RUNNER_TEMP/prior-source/AUTHORIZATION.json" "$RUNNER_TEMP/panel-opened/AUTHORIZATION.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: en-v6-b18-primary-panel-opened
        path: ${{ runner.temp }}/panel-opened/
        retention-days: 90
        if-no-files-found: error
    - name: Generate the 96 newly registered originals exactly once
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check --no-cache-dir --retries 0 --timeout 90 'piper-tts==1.8.0' 'numpy==1.26.4' 'scipy==1.15.3' 'huggingface-hub==0.36.2'
        python -IB automation/english_v6_b18_source.py generate "$RUNNER_TEMP/source" "$RUNNER_TEMP/prior-source" "$PREPARED_PARENT"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: english-v6-b18-primary-source-${{ github.run_id }}
        path: ${{ runner.temp }}/source/
        retention-days: 90
        if-no-files-found: warn
  observers:
    needs: sources
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        provider: [qwen, parakeet, xlsr, lv60, whisper]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Guard the same original source execution before model installation
      run: python -IB automation/english_v6_b18_source.py guard "$PREPARED_PARENT"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: english-v6-b18-primary-source-${{ github.run_id }}
        path: ${{ runner.temp }}/source
    - name: Install one pinned native observer runtime
      shell: bash
      timeout-minutes: 19
      env:
        PROVIDER: ${{ matrix.provider }}
      run: |
        set -euo pipefail
        python -m venv "$RUNNER_TEMP/b18-native-env"
        PIP="$RUNNER_TEMP/b18-native-env/bin/pip"
        FLAGS="--disable-pip-version-check --no-cache-dir --retries 0 --timeout 90"
        if [ "$PROVIDER" != "parakeet" ]; then
          if [ "$PROVIDER" = "qwen" ] || [ "$PROVIDER" = "whisper" ]; then
            "$PIP" install $FLAGS 'torch==2.9.1+cpu' 'torchaudio==2.9.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
          else
            "$PIP" install $FLAGS 'torch==2.9.1+cpu' --extra-index-url https://download.pytorch.org/whl/cpu
          fi
        fi
        case "$PROVIDER" in
          qwen) "$PIP" install $FLAGS 'qwen-asr==0.0.6' 'huggingface-hub==0.36.2' ;;
          whisper) "$PIP" install $FLAGS 'openai-whisper==20250625' ;;
          parakeet) "$PIP" install $FLAGS 'huggingface-hub==0.36.2' 'hf-xet==1.2.0' ;;
          xlsr|lv60) "$PIP" install $FLAGS 'transformers==4.46.3' 'numpy==1.26.4' 'huggingface-hub==0.36.2' ;;
          *) exit 7 ;;
        esac
        "$RUNNER_TEMP/b18-native-env/bin/python" -m pip check
    - name: Save native return before validation for each full original
      shell: bash
      env:
        PROVIDER: ${{ matrix.provider }}
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/b18-native-env/bin/python" -IB automation/english_v6_b18_source.py observe "$PROVIDER" "$RUNNER_TEMP/source" "$RUNNER_TEMP/$PROVIDER" "$PREPARED_PARENT"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: b18-primary-dev-observer-${{ matrix.provider }}
        path: ${{ runner.temp }}/${{ matrix.provider }}/
        retention-days: 90
        if-no-files-found: warn
  readback:
    needs: [sources, observers]
    if: always() && needs.sources.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        fetch-depth: 2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Guard original event before source readback
      run: python -IB automation/english_v6_b18_source.py guard "$PREPARED_PARENT"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: english-v6-b18-primary-source-${{ github.run_id }}
        path: ${{ runner.temp }}/source
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: b18-primary-dev-observer-*
        path: ${{ runner.temp }}/providers
    - name: Require five valid raw receipts per source before unchanged admission
      shell: bash
      run: |
        set -euo pipefail
        for p in qwen whisper parakeet xlsr lv60; do
          mv "$RUNNER_TEMP/providers/b18-primary-dev-observer-$p" "$RUNNER_TEMP/providers/$p"
        done
        mkdir "$RUNNER_TEMP/final"
        python -IB automation/english_v6_b18_source.py screen "$RUNNER_TEMP/source" "$RUNNER_TEMP/providers" "$RUNNER_TEMP/final/SCREEN.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: english-v6-b18-primary-frozen-screen-${{ github.run_id }}
        path: ${{ runner.temp }}/final/
        retention-days: 90
        if-no-files-found: error
